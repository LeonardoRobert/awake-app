name: awake_app
description: App de gestao do ministerio Awake - calendario, voluntariado, metas e treinamentos.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Traduz os componentes visuais do proprio Flutter (calendario/seletor
  # de data e hora, botoes padrao, etc) para portugues
  flutter_localizations:
    sdk: flutter

  # Usado pra montar o arquivo de imagem na hora de compartilhar no WhatsApp
  cross_file: ^0.3.4+2

  # Foto de evento (escolher da galeria) e compartilhamento
  image_picker: ^1.1.2
  share_plus: ^10.1.2

  # Busca de endereco por CEP (cadastro e edicao de perfil)
  http: ^1.2.0

  # Backend / dados
  supabase_flutter: ^2.5.6

  # Gerenciamento de estado
  flutter_riverpod: ^2.5.1

  # Navegacao
  go_router: ^14.2.0

  # QR Code (gerar e ler)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Push notifications
  onesignal_flutter: ^5.1.2

  # Utilidades
  intl: ^0.20.2
  table_calendar: ^3.1.2
  uuid: ^4.4.0

  # Tipografia (ver observacao em lib/core/theme/app_theme.dart sobre Canva Sans)
  google_fonts: ^6.2.1

  # Player de video embutido (usado no modulo de Treinamentos)
  webview_flutter: ^4.9.0

  # Abrir links externos (usado no player de treinamento na versao web)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/awake_icon_square_v2.png"
  adaptive_icon_background: "#0C192E"
  adaptive_icon_foreground: "assets/images/awake_flame_adaptive.png"
  web:
    generate: true
    image_path: "assets/images/awake_icon_square_v2.png"
    background_color: "#0C192E"
    theme_color: "#0C192E"
