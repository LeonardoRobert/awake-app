name: Keep Supabase Awake

on:
  schedule:
    # Roda a cada 3 dias, bem dentro da janela de 7 dias que o
    # Supabase usa pra pausar projetos do plano gratuito por inatividade.
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer uma consulta simples no banco
        run: |
          curl -s -o /dev/null -w "Resposta do Supabase: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
