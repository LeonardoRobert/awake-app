            <option value="boleto">Boleto</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <p class="erro-form" id="ef-erro"></p>
        <button class="botao-primario" style="width:auto;padding:9px 20px;" id="ef-btn-lancar">Lançar</button>
      </div>

      <h3 style="margin-top:24px;">Participantes</h3>
      ${participantes.length === 0 ? '<div class="vazio-lateral">Ninguém lançou pagamento pra esse evento ainda.</div>' : participantes.map(p => `
        <div class="cartao-lancamento" style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <strong>${escaparHtml(p.nome)}</strong>
            <span class="valor-simples">R$ ${p.total.toFixed(2)}${valorTotal ? ' de R$ ' + valorTotal.toFixed(2) : ''}</span>
          </div>
          ${valorTotal ? `<div class="barra-progresso-simples"><div class="preenchido" style="width:${Math.min(100, Math.round((p.total / valorTotal) * 100))}%;"></div></div>` : ''}
          <div style="margin-top:8px;">
            ${p.lancamentos.map(l => `
              <div class="item-historico">
                <div>
                  <div class="valor-historico">R$ ${Number(l.valor).toFixed(2)}</div>
                  <div class="meta-historico">${new Date(l.data).toLocaleDateString('pt-BR')} • ${LABEL_MEIO_EXTRATO[l.meio_pagamento] || l.meio_pagamento}</div>
                </div>
                <button class="excluir-lancamento" data-id="${l.id}">Excluir</button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}`;

    document.getElementById('ef-btn-lancar').addEventListener('click', () => lancarPagamentoEvento(evento.id));
    el.querySelectorAll('.excluir-lancamento').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir esse lançamento?')) return;
        await supa.from('contribuicoes').delete().eq('id', btn.dataset.id);
        await renderizarDetalheEventoFinanceiro();
      });
    });
  }

  async function lancarPagamentoEvento(eventoId) {
    const erroEl = document.getElementById('ef-erro');
    erroEl.textContent = '';
    const profileId = document.getElementById('ef-select-pessoa').value;
    const valor = parseFloat(document.getElementById('ef-valor').value.replace(',', '.'));
    const data = document.getElementById('ef-data').value;
    const meio = document.getElementById('ef-meio').value;

    if (!profileId) { erroEl.textContent = 'Escolha a pessoa.'; return; }
    if (!valor || valor <= 0) { erroEl.textContent = 'Informe um valor válido.'; return; }

    const { error } = await supa.from('contribuicoes').insert({
      profile_id: profileId,
      data,
      valor,
      meio_pagamento: meio,
      evento_id: eventoId,
    });

    if (error) { erroEl.textContent = 'Erro ao lançar: ' + error.message; return; }

    await renderizarDetalheEventoFinanceiro();
  }

  // =========================================================
  // Importar extrato (PagBank / Cora / Stone) -- sem uso hoje (ver
  // comentario da secao "Eventos ingressados" acima), mantido intacto
  // caso a tesouraria mude de ideia.
  // =========================================================
  // Parsers testados isoladamente contra arquivos de exemplo reais antes
  // de integrar aqui -- ver decisoes tomadas com o Leo:
  // - PagBank: TIPO "Pix recebido" OU "QR Code Pix recebido" (decisao
  //   revista -- QR Code tambem precisa entrar, e um Pix recebido
  //   normal, so mudou o jeito de gerar o codigo).
  // - Cora: Valor usa PONTO como decimal (nao virgula, diferente dos
  //   outros dois bancos) -- confirmado testando contra o arquivo real.
  // - Stone: Movimentacao=Credito E (Tipo=Pix OU (Tipo=Transacao E
  //   Origem != "Desconhecido")) -- "Transacao" com Origem Desconhecido
  //   e evento de sistema/tarifa, nao e pessoa. "Transferencia entre
  //   contas Stone" fica de fora (e dinheiro entre contas da propria
  //   igreja, nao e doacao).

  /// Parser CSV generico que respeita campos entre aspas com o proprio
  /// separador dentro (o Stone usa isso, ex: "R$ 24.262,92").
  function parseCsvExtrato(texto, separador) {
    const linhas = [];
    let campo = '', linha = [], dentroAspas = false;
    texto = texto.replace(/^﻿/, '').replace(/\r\n/g, '\n');

    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (dentroAspas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else dentroAspas = false;
        } else campo += c;
      } else if (c === '"') {
        dentroAspas = true;
      } else if (c === separador) {
        linha.push(campo); campo = '';
      } else if (c === '\n') {
        linha.push(campo); campo = '';
        linhas.push(linha); linha = [];
      } else {
        campo += c;
      }
    }
    if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
    return linhas.filter(l => l.length > 1 || (l.length === 1 && l[0].trim() !== ''));
  }

  function linhasCsvParaObjetos(linhasCsv) {
    const cabecalho = linhasCsv[0].map(h => h.trim());
    return linhasCsv.slice(1).map(linha => {
      const obj = {};
      cabecalho.forEach((h, i) => obj[h] = (linha[i] ?? '').trim());
      return obj;
    });
  }

  function dataBrParaIso(str) {
    const [d, m, a] = str.split('/').map(Number);
    return `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function decimalComVirgula(str) {
    return parseFloat(str.trim().replace(/\./g, '').replace(',', '.'));
  }

  /// Le o arquivo tentando UTF-8 primeiro; extratos bancarios as vezes
  /// vem em Windows-1252/Latin-1, o que quebraria acentos silenciosamente
  /// se so assumissemos UTF-8.
  async function lerArquivoExtrato(arquivo) {
    const buffer = await arquivo.arrayBuffer();
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    } catch {
      return new TextDecoder('windows-1252').decode(buffer);
    }
  }

  const OBSERVACAO_PADRAO_BANCO_EXTRATO = {
    pagbank: 'Importado do extrato PagBank',
    cora: 'Importado do extrato Cora — Movimento da Paz',
    stone: 'Importado do extrato Stone',
  };

  const PARSERS_EXTRATO = {
    pagbank: {
      extrair(texto) {
        return linhasCsvParaObjetos(parseCsvExtrato(texto, ';'))
          .filter(o => o.TIPO === 'Pix recebido' || o.TIPO === 'QR Code Pix recebido')
          .map(o => ({
            data: dataBrParaIso(o.DATA),
            horario: null,
            nome: o.DESCRICAO,
            valor: decimalComVirgula(o.VALOR),
          }));
      },
    },
    cora: {
      extrair(texto) {
        return linhasCsvParaObjetos(parseCsvExtrato(texto, ','))
          .filter(o => o['Tipo Transação'] === 'CRÉDITO')
          .map(o => ({
            data: dataBrParaIso(o.Data),
            horario: null,
            nome: o['Identificação'],
            valor: parseFloat(o.Valor), // Cora usa ponto decimal, nao virgula
          }));
      },
    },
    stone: {
      extrair(texto) {
        return linhasCsvParaObjetos(parseCsvExtrato(texto, ','))
          .filter(o => o['Movimentação'] === 'Crédito' &&
            (o.Tipo === 'Pix' || (o.Tipo === 'Transação' && o.Origem !== 'Desconhecido')))
          .map(o => {
            const [dataParte, horaParte] = o.Data.split(' ');
            return {
              data: dataBrParaIso(dataParte),
              horario: horaParte || null,
              nome: o.Origem,
              valor: decimalComVirgula(o.Valor),
              // A coluna Tipo ja diz Pix ou Transacao (transferencia) --
              // antes isso era jogado fora e tudo virava "pix" fixo.
              meioPagamento: o.Tipo === 'Pix' ? 'pix' : 'transferencia',
            };
          });
      },
    },
  };

  function formatarDataBrExtrato(isoData) {
    const [a, m, d] = isoData.split('-');
    return `${d}/${m}/${a}`;
  }

  let bancoExtratoEscolhido = null;
  let linhasExtratoRevisao = []; // {data, horario, nome, valor, profileId, eventoId, ignorar}
  let eventosIngressadosCache = null;
  let quantidadeDuplicadaExtrato = 0; // linhas descartadas por ja terem sido importadas antes
  let erroCasamentoNomeExtrato = null; // erro da RPC tentar_casar_transacao, se der -- nao pode ficar silencioso

  function iniciarImportarExtrato() {
    document.querySelectorAll('input[name="banco-extrato"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        bancoExtratoEscolhido = e.target.value;
        document.getElementById('input-extrato').value = '';
        document.getElementById('erro-extrato').textContent = '';
        document.getElementById('resumo-extrato').innerHTML = '';
        document.getElementById('revisao-extrato').innerHTML = '';
        linhasExtratoRevisao = [];
        quantidadeDuplicadaExtrato = 0;
      });
    });
    document.getElementById('input-extrato').addEventListener('change', processarArquivoExtrato);
    carregarImportacoesRecentes();
  }

  // Lista os ultimos lotes de importacao (agrupados no proprio JS por
  // lote_importacao_id, que cada linha ganha no momento do "Confirmar
  // tudo"), com botao pra apagar um lote inteiro de uma vez -- pra
  // desfazer uma importacao que saiu errada.
  async function carregarImportacoesRecentes() {
    const el = document.getElementById('importacoes-recentes');
    if (!el) return;
    el.innerHTML = '<div class="vazio-lateral">Carregando importações recentes...</div>';

    const { data, error } = await supa
      .from('contribuicoes')
      .select('lote_importacao_id, banco_origem, data')
      .not('lote_importacao_id', 'is', null)
      .order('data', { ascending: false })
      .limit(1000);

    if (error || !data || data.length === 0) {
      el.innerHTML = '';
      return;
    }

    const lotes = new Map();
    for (const linha of data) {
      const chave = linha.lote_importacao_id;
      if (!lotes.has(chave)) {
        lotes.set(chave, { banco: linha.banco_origem, min: linha.data, max: linha.data, qtd: 0 });
      }
      const l = lotes.get(chave);
      l.qtd++;
      if (linha.data < l.min) l.min = linha.data;
      if (linha.data > l.max) l.max = linha.data;
    }

    // Mais recente primeiro (pela maior data de cada lote), so os
    // ultimos 10 -- nao precisa listar importacao de meses atras aqui.
    const listaLotes = [...lotes.entries()]
      .sort((a, b) => b[1].max.localeCompare(a[1].max))
      .slice(0, 10);

    el.innerHTML = `
      <h3>Importações recentes</h3>
      ${listaLotes.map(([loteId, l]) => `
        <div class="item-historico">
          <div>
            <div class="valor-historico">${LABEL_BANCO_EXTRATO[l.banco] || l.banco} — ${l.qtd} lançamento(s)</div>
            <div class="meta-historico">${formatarDataBrExtrato(l.min)}${l.min !== l.max ? ' a ' + formatarDataBrExtrato(l.max) : ''}</div>
          </div>
          <button class="excluir-lancamento" data-lote="${loteId}">Apagar essa importação</button>
        </div>
      `).join('')}`;

    el.querySelectorAll('[data-lote]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Apagar TODOS os lançamentos dessa importação? Essa ação não pode ser desfeita.')) return;
        btn.disabled = true;
        await supa.from('contribuicoes').delete().eq('lote_importacao_id', btn.dataset.lote);
        await carregarImportacoesRecentes();
      });
    });
  }

  // Mesma normalizacao usada em tentar_casar_transacao() (SQL) --
  // ignora acento, maiuscula/minuscula, apostrofo/aspas e espacos
  // duplicados -- pra montar uma chave estavel mesmo que o extrato
  // venha formatado ligeiramente diferente de uma semana pra outra.
  function normalizarNomeParaChave(nome) {
    return (nome || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/['`´‘’]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Chave de deduplicacao: banco + data + valor + nome normalizado (+
  // horario quando o banco fornece, ex: Stone). PagBank e Cora so tem
  // data (sem hora) no extrato -- o valor entra na chave justamente
  // pra nao confundir 2 entradas reais da mesma pessoa no mesmo dia
  // (ex: dizimo e oferta no mesmo domingo, valores diferentes).
  function montarChaveImportacao(linha) {
    const partes = [bancoExtratoEscolhido, linha.data, linha.valor.toFixed(2), normalizarNomeParaChave(linha.nome)];
    if (linha.horario) partes.push(linha.horario);
    return partes.join('|');
  }

  async function processarArquivoExtrato(e) {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    const erroEl = document.getElementById('erro-extrato');
    erroEl.textContent = '';

    if (!bancoExtratoEscolhido) {
      erroEl.textContent = 'Escolha qual banco é esse extrato antes de anexar o arquivo.';
      e.target.value = '';
      return;
    }

    document.getElementById('resumo-extrato').innerHTML = '<div class="vazio-lateral">Lendo arquivo...</div>';
    document.getElementById('revisao-extrato').innerHTML = '';

    try {
      const texto = await lerArquivoExtrato(arquivo);
      const linhasBrutas = PARSERS_EXTRATO[bancoExtratoEscolhido].extrair(texto);

      if (linhasBrutas.length === 0) {
        document.getElementById('resumo-extrato').innerHTML =
          '<div class="vazio-lateral">Nenhuma linha de entrada de dinheiro encontrada nesse arquivo.</div>';
        return;
      }

      // Deduplicacao: extrato importado toda semana costuma reincluir
      // dias ja importados antes -- descarta aqui, ANTES de mostrar a
      // revisao, pra nao pedir escolha 2x da mesma entrada nem lancar
      // ela de novo.
      const chavesDoArquivo = linhasBrutas.map(l => montarChaveImportacao(l));
      const { data: jaImportadas } = await supa
        .from('contribuicoes')
        .select('chave_importacao')
        .in('chave_importacao', chavesDoArquivo);
      const chavesJaImportadas = new Set((jaImportadas || []).map(c => c.chave_importacao));

      const linhasNovas = linhasBrutas.filter((l, i) => !chavesJaImportadas.has(chavesDoArquivo[i]));
      quantidadeDuplicadaExtrato = linhasBrutas.length - linhasNovas.length;

      if (linhasNovas.length === 0) {
        document.getElementById('resumo-extrato').innerHTML =
          `<div class="vazio-lateral">Todas as ${linhasBrutas.length} linha(s) desse arquivo já tinham sido importadas antes.</div>`;
        return;
      }

      if (!todasPessoas.length) {
        const { data } = await supa.from('profiles').select('id, nome, valor_dizimo_padrao').order('nome');
        todasPessoas = data || [];
      }
      if (!eventosIngressadosCache) {
        const { data } = await supa.from('eventos').select('id, titulo').eq('ingressado', true).order('titulo');
        eventosIngressadosCache = data || [];
      }

      // Tenta casar cada linha com uma pessoa cadastrada (mesma funcao
      // ja usada antes pra esse fim, so casa quando o nome bate exato
      // -- sem acento/case -- com uma UNICA pessoa).
      erroCasamentoNomeExtrato = null;
      linhasExtratoRevisao = await Promise.all(linhasNovas.map(async (linha) => {
        const { data: profileId, error: erroRpc } = await supa.rpc('tentar_casar_transacao', { p_nome_pagador: linha.nome });
        // Guarda so o primeiro erro -- se a funcao estiver quebrada,
        // vai falhar em toda linha igual, nao precisa acumular todos.
        if (erroRpc && !erroCasamentoNomeExtrato) erroCasamentoNomeExtrato = erroRpc.message;
        // Auto-detecta "Dizimo" quando o valor da linha bate com o
        // valor fixo salvo da pessoa que casou -- editavel na revisao,
        // igual o lancamento manual.
        const pessoaCasada = profileId ? todasPessoas.find(p => p.id === profileId) : null;
        const valorFixo = pessoaCasada?.valor_dizimo_padrao;
        const tipoDetectado = valorFixo != null && linha.valor === Number(valorFixo) ? 'dizimo' : null;
        return {
          ...linha,
          chaveImportacao: montarChaveImportacao(linha),
          profileId: profileId || null,
          // Pre-preenche com "Usuario nao cadastrado" quando nao casou --
          // evita a linha ficar em branco esperando escolha manual; o
          // admin so muda se for o caso de "Credito sem identificacao".
          motivoSemUsuario: profileId ? null : '__nao_cadastrado__',
          eventoId: null,
          ignorar: false,
          // Stone ja diz o meio certo por linha (pix/transferencia) --
          // so cai pra "pix" quando o parser nao especificou nada
          // (PagBank/Cora, que so lidam com Pix mesmo).
          meioPagamento: linha.meioPagamento || 'pix',
          tipo: tipoDetectado,
          observacao: OBSERVACAO_PADRAO_BANCO_EXTRATO[bancoExtratoEscolhido],
        };
      }));

      renderizarResumoExtrato();
      renderizarRevisaoExtrato();
    } catch (erro) {
      erroEl.textContent = 'Erro ao ler o arquivo: ' + erro.message;
      document.getElementById('resumo-extrato').innerHTML = '';
    }
  }

  function renderizarResumoExtrato() {
    const total = linhasExtratoRevisao.length;
    const casadas = linhasExtratoRevisao.filter(l => l.profileId).length;
    document.getElementById('resumo-extrato').innerHTML = `
      <div class="cartao-lancamento" style="margin-top:16px;">
        ${erroCasamentoNomeExtrato ? `<p class="erro-form">Casamento automático de nome falhou: ${escaparHtml(erroCasamentoNomeExtrato)} (todas as linhas caíram pra escolha manual por causa disso).</p>` : ''}
        ${quantidadeDuplicadaExtrato > 0 ? `<div style="margin-bottom:8px;">${quantidadeDuplicadaExtrato} linha(s) já importada(s) antes foram ignoradas automaticamente.</div>` : ''}
        <strong>${total}</strong> linha(s) nova(s) — <strong>${casadas}</strong> casaram automático,
        <strong>${total - casadas}</strong> precisam de escolha manual.
        <div style="margin-top:12px;">
          <button class="botao-primario" style="width:auto;padding:9px 20px;" id="btn-confirmar-extrato">Confirmar tudo</button>
        </div>
        <p class="erro-form" id="erro-confirmar-extrato"></p>
      </div>`;
    document.getElementById('btn-confirmar-extrato').addEventListener('click', confirmarImportacaoExtrato);
  }

  const LABEL_BANCO_EXTRATO = { pagbank: 'PagBank', cora: 'Cora', stone: 'Stone' };
  const LABEL_MEIO_EXTRATO = {
    pix: 'Pix', dinheiro: 'Dinheiro', cartao: 'Cartão',
    transferencia: 'Transferência', boleto: 'Boleto', outro: 'Outro',
  };
  const LABEL_TIPO_EXTRATO = {
    '': 'Não especificado', dizimo: 'Dízimo', oferta: 'Oferta',
    oferta_missionaria: 'Oferta missionária', movimento_paz: 'Movimento da Paz', outro: 'Outro',
  };

  function renderizarRevisaoExtrato() {
    const el = document.getElementById('revisao-extrato');
    const labelConta = LABEL_BANCO_EXTRATO[bancoExtratoEscolhido] || bancoExtratoEscolhido;

    el.innerHTML = `
      <div class="tabela-revisao-wrap">
        <table class="tabela-revisao">
          <thead>
            <tr>
              <th>Nome completo</th>
              <th>Conta</th>
              <th>Meio de pagamento</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Data e horário</th>
              <th>Descrição</th>
              <th>Ignorar</th>
            </tr>
          </thead>
          <tbody>
            ${linhasExtratoRevisao.map((linha, i) => {
              const classeLinha = linha.profileId ? 'linha-casada' : (linha.motivoSemUsuario ? 'linha-sem-usuario' : '');
              const valorSelecionado = linha.profileId || linha.motivoSemUsuario || '';
              return `
                <tr class="${classeLinha}">
                  <td>
                    <div class="nome-extrato-original">${escaparHtml(linha.nome)}</div>
                    <select class="select-pessoa-extrato" data-indice="${i}">
                      <option value="">Selecionar...</option>
                      <option value="__nao_cadastrado__" ${valorSelecionado === '__nao_cadastrado__' ? 'selected' : ''}>Usuário não cadastrado</option>
                      <option value="__sem_identificacao__" ${valorSelecionado === '__sem_identificacao__' ? 'selected' : ''}>Crédito sem identificação</option>
                      ${todasPessoas.map(p => `<option value="${p.id}" ${p.id === linha.profileId ? 'selected' : ''}>${escaparHtml(p.nome)}</option>`).join('')}
                    </select>
                  </td>
                  <td>${escaparHtml(labelConta)}</td>
                  <td>
                    <select class="select-meio-extrato" data-indice="${i}">
                      ${Object.entries(LABEL_MEIO_EXTRATO).map(([v, l]) => `<option value="${v}" ${v === linha.meioPagamento ? 'selected' : ''}>${l}</option>`).join('')}
                    </select>
                  </td>
                  <td>
                    <select class="select-tipo-extrato" data-indice="${i}">
                      ${Object.entries(LABEL_TIPO_EXTRATO).map(([v, l]) => `<option value="${v}" ${!linha.eventoId && v === (linha.tipo || '') ? 'selected' : ''}>${l}</option>`).join('')}
                      ${eventosIngressadosCache.length ? `
                        <optgroup label="Evento ingressado">
                          ${eventosIngressadosCache.map(ev => `<option value="evento:${ev.id}" ${linha.eventoId === ev.id ? 'selected' : ''}>${escaparHtml(ev.titulo)}</option>`).join('')}
                        </optgroup>` : ''}
                    </select>
                  </td>
                  <td style="white-space:nowrap;">R$ ${linha.valor.toFixed(2)}</td>
                  <td style="white-space:nowrap;">${formatarDataBrExtrato(linha.data)}${linha.horario ? ' ' + linha.horario.slice(0, 5) : ''}</td>
                  <td>
                    <input type="text" class="input-observacao-extrato" data-indice="${i}" value="${escaparAtributo(linha.observacao)}">
                  </td>
                  <td style="text-align:center;">
                    <input type="checkbox" class="chk-ignorar-extrato" data-indice="${i}" ${linha.ignorar ? 'checked' : ''}>
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;

    el.querySelectorAll('.select-pessoa-extrato').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const valor = e.target.value;
        const linha = linhasExtratoRevisao[e.target.dataset.indice];
        if (valor === '__nao_cadastrado__' || valor === '__sem_identificacao__') {
          linha.profileId = null;
          linha.motivoSemUsuario = valor;
        } else {
          linha.profileId = valor || null;
          linha.motivoSemUsuario = null;
        }
        const tr = sel.closest('tr');
        tr.classList.remove('linha-casada', 'linha-sem-usuario');
        if (linha.profileId) tr.classList.add('linha-casada');
        else if (linha.motivoSemUsuario) tr.classList.add('linha-sem-usuario');
      });
    });
    el.querySelectorAll('.select-meio-extrato').forEach(sel => {
      sel.addEventListener('change', (e) => {
        linhasExtratoRevisao[e.target.dataset.indice].meioPagamento = e.target.value;
      });
    });
    el.querySelectorAll('.select-tipo-extrato').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const linha = linhasExtratoRevisao[e.target.dataset.indice];
        const valor = e.target.value;
        if (valor.startsWith('evento:')) {
          linha.eventoId = valor.slice('evento:'.length);
          linha.tipo = null;
        } else {
          linha.eventoId = null;
          linha.tipo = valor || null;
        }
      });
    });
    el.querySelectorAll('.input-observacao-extrato').forEach(inp => {
      inp.addEventListener('input', (e) => {
        linhasExtratoRevisao[e.target.dataset.indice].observacao = e.target.value;
      });
    });
    el.querySelectorAll('.chk-ignorar-extrato').forEach(chk => {
      chk.addEventListener('change', (e) => {
        linhasExtratoRevisao[e.target.dataset.indice].ignorar = e.target.checked;
      });
    });
  }

  // Sentinela do <select> (evita colidir com um profileId de verdade
  // no mesmo value-space) -> valor limpo aceito pela CHECK constraint
  // de contribuicoes.motivo_sem_usuario.
  const MOTIVO_SEM_USUARIO_BANCO = {
    '__nao_cadastrado__': 'nao_cadastrado',
    '__sem_identificacao__': 'sem_identificacao',
  };

  async function confirmarImportacaoExtrato() {
    const erroEl = document.getElementById('erro-confirmar-extrato');
    erroEl.textContent = '';

    // "Ignorar" dispensa a escolha de pessoa -- todo o resto precisa
    // de pessoa, "Usuário não cadastrado" ou "Crédito sem identificação".
    const paraRevisar = linhasExtratoRevisao.filter(l => !l.ignorar);
    const semEscolha = paraRevisar.filter(l => !l.profileId && !l.motivoSemUsuario);
    if (semEscolha.length > 0) {
      erroEl.textContent = `${semEscolha.length} linha(s) sem "Nome completo" escolhido. Selecione a pessoa, "Usuário não cadastrado", "Crédito sem identificação", ou marque "Ignorar".`;
      return;
    }

    const botao = document.getElementById('btn-confirmar-extrato');
    botao.disabled = true;
    botao.textContent = 'Lançando...';

    // TODA linha vira uma linha em contribuicoes agora -- casada,
    // sem usuário ou ignorada -- pra aparecer em Entradas e pra ficar
    // lembrada (chave_importacao) e não ser reimportada semana que vem.
    // "Ignorada" entra com profile_id nulo + motivo_sem_usuario
    // 'ignorado', e o dashboard de Entradas exclui esse motivo do total.
    // lote_importacao_id e o mesmo pra todas as linhas desse clique --
    // serve so pra dar pra apagar essa importacao inteira de uma vez
    // depois, se foi importada errada (ver carregarImportacoesRecentes).
    const loteId = crypto.randomUUID();
    const payload = linhasExtratoRevisao.map(l => ({
      profile_id: l.ignorar ? null : (l.profileId || null),
      motivo_sem_usuario: l.ignorar ? 'ignorado' : (l.profileId ? null : MOTIVO_SEM_USUARIO_BANCO[l.motivoSemUsuario]),
      data: l.data,
      horario: l.horario,
      valor: l.valor,
      meio_pagamento: l.meioPagamento,
      observacao: l.observacao || null,
      evento_id: l.ignorar ? null : (l.eventoId || null),
      tipo: l.ignorar ? null : (l.tipo || null),
      banco_origem: bancoExtratoEscolhido,
      chave_importacao: l.chaveImportacao,
      lote_importacao_id: loteId,
    }));

    // upsert + ignoreDuplicates: se uma linha igual (mesma chave_importacao)
    // ja tiver sido lancada por outra pessoa nesse meio tempo, o Postgres
    // so pula ela em silencio -- nao trava o lote inteiro com erro.
    const { error } = await supa
      .from('contribuicoes')
      .upsert(payload, { onConflict: 'chave_importacao', ignoreDuplicates: true });

    botao.disabled = false;
    botao.textContent = 'Confirmar tudo';

    if (error) { erroEl.textContent = 'Erro ao lançar: ' + error.message; return; }

    const casadas = linhasExtratoRevisao.filter(l => !l.ignorar && l.profileId).length;
    const semUsuario = linhasExtratoRevisao.filter(l => !l.ignorar && !l.profileId).length;
    const ignoradas = linhasExtratoRevisao.length - paraRevisar.length;
    document.getElementById('resumo-extrato').innerHTML = `
      <div class="cartao-lancamento" style="margin-top:16px;">
        ✅ ${linhasExtratoRevisao.length} linha(s) processada(s) com sucesso.
        <br>${casadas} vinculada(s) a usuário.
        ${semUsuario ? `<br>${semUsuario} sem usuário vinculado (aparecem em Entradas mesmo assim).` : ''}
        ${ignoradas ? `<br>${ignoradas} ignorada(s).` : ''}
      </div>`;
    document.getElementById('revisao-extrato').innerHTML = '';
    linhasExtratoRevisao = [];
    document.getElementById('input-extrato').value = '';
    await carregarImportacoesRecentes();
  }

  // =========================================================
  // Entradas -- dashboard mensal (dizimo/oferta/oferta missionaria/
  // movimento da paz/evento ingressado), incluindo linhas sem usuario
  // vinculado. So conta pro total quem NAO foi marcado como "ignorado"
  // na revisao do extrato. Sem uso hoje (ver comentario da secao
  // "Eventos ingressados"), mantido intacto.
  // =========================================================
  const LABEL_TIPO_ENTRADA = {
    dizimo: 'Dízimo', oferta: 'Oferta', oferta_missionaria: 'Oferta missionária',
    movimento_paz: 'Movimento da Paz', outro: 'Outro', nao_especificado: 'Não especificado',
  };

  function labelMotivoEntrada(motivo) {
    if (motivo === 'nao_cadastrado') return 'Usuário não cadastrado';
    if (motivo === 'sem_identificacao') return 'Crédito sem identificação';
    if (motivo === 'ignorado') return 'Ignorado';
    return '(sem nome)';
  }

  // Segunda-feira da semana de uma data 'YYYY-MM-DD' -- mesma
  // convencao de semana (segunda a domingo) usada na agenda do site
  // publico. Construido em UTC de proposito, igual o resto do projeto
  // faz com essas strings de data pura (sem hora) -- evita o bug ja
  // conhecido de virar o dia errado por causa de fuso.
  function segundaFeiraDaSemana(isoData) {
    const [ano, mes, dia] = isoData.split('-').map(Number);
    const d = new Date(Date.UTC(ano, mes - 1, dia));
    const diaSemana = d.getUTCDay(); // 0 = domingo, 1 = segunda...
    d.setUTCDate(d.getUTCDate() + (diaSemana === 0 ? -6 : 1 - diaSemana));
    return d;
  }

  function formatarDataCurtaUtc(d) {
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' });
  }

  let todasEntradas = [];
  let mesEntradasSelecionado = null;

  async function iniciarEntradas() {
    document.getElementById('entradas-lista-meses').innerHTML = '<div class="vazio-lateral">Carregando...</div>';
    const { data, error } = await supa
      .from('contribuicoes')
      .select('id, data, horario, valor, tipo, motivo_sem_usuario, evento_id, meio_pagamento, banco_origem, profiles!contribuicoes_profile_id_fkey(nome), eventos(titulo)')
      .order('data', { ascending: false });

    if (error) {
      document.getElementById('entradas-lista-meses').innerHTML =
        `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml(error.message)}</div>`;
      return;
    }

    todasEntradas = data || [];
    mesEntradasSelecionado = null;
    renderizarListaMesesEntradas();
    document.getElementById('entradas-detalhe-mes').innerHTML = '';
  }

  function renderizarListaMesesEntradas() {
    const porMes = {};
    todasEntradas.forEach(e => {
      const chave = e.data.slice(0, 7);
      if (!porMes[chave]) porMes[chave] = 0;
      if (e.motivo_sem_usuario !== 'ignorado') porMes[chave] += Number(e.valor);
    });

    const el = document.getElementById('entradas-lista-meses');
    const meses = Object.keys(porMes).sort().reverse();
    if (meses.length === 0) {
      el.innerHTML = '<div class="vazio-lateral">Nenhuma entrada registrada ainda.</div>';
      return;
    }

    el.innerHTML = meses.map(chave => {
      const [ano, mes] = chave.split('-').map(Number);
      const nomeMes = new Date(Date.UTC(ano, mes - 1, 1))
        .toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      return `
        <div class="item-mes-entrada ${chave === mesEntradasSelecionado ? 'ativo' : ''}" data-chave="${chave}">
          <span>${nomeMes[0].toUpperCase()}${nomeMes.slice(1)}</span>
          <span class="valor-simples">R$ ${porMes[chave].toFixed(2)}</span>
        </div>`;
    }).join('');

    el.querySelectorAll('.item-mes-entrada').forEach(item => {
      item.addEventListener('click', () => {
        mesEntradasSelecionado = mesEntradasSelecionado === item.dataset.chave ? null : item.dataset.chave;
        renderizarListaMesesEntradas();
        renderizarDetalheMesEntradas();
      });
    });
  }

  function renderizarDetalheMesEntradas() {
    const el = document.getElementById('entradas-detalhe-mes');
    if (!mesEntradasSelecionado) { el.innerHTML = ''; return; }

    const linhasDoMes = todasEntradas.filter(e => e.data.slice(0, 7) === mesEntradasSelecionado);
    const linhasValidas = linhasDoMes.filter(e => e.motivo_sem_usuario !== 'ignorado');

    const porTipo = {};
    linhasValidas.filter(e => !e.evento_id).forEach(e => {
      const chave = e.tipo || 'nao_especificado';
      porTipo[chave] = (porTipo[chave] || 0) + Number(e.valor);
    });

    const porEvento = {};
    linhasValidas.filter(e => e.evento_id).forEach(e => {
      const titulo = e.eventos?.titulo || '(evento removido)';
      porEvento[titulo] = (porEvento[titulo] || 0) + Number(e.valor);
    });

    // Semana = segunda a domingo. Uma semana pode comecar ou terminar
    // fora do mes selecionado (ex: primeira semana de agosto pode
    // comecar numa segunda de julho) -- mostra o intervalo real da
    // semana mesmo assim, so soma o que caiu dentro do mes.
    const porSemana = {};
    linhasValidas.forEach(e => {
      const inicio = segundaFeiraDaSemana(e.data);
      const chave = inicio.toISOString().slice(0, 10);
      if (!porSemana[chave]) porSemana[chave] = { inicio, total: 0 };
      porSemana[chave].total += Number(e.valor);
    });

    el.innerHTML = `
      <h3 style="margin-top:24px;">Por categoria</h3>
      <div class="lista-simples">
        ${Object.entries(porTipo).sort((a, b) => b[1] - a[1]).map(([chave, valor]) => `
          <div class="linha-simples"><span>${LABEL_TIPO_ENTRADA[chave] || chave}</span><span class="valor-simples">R$ ${valor.toFixed(2)}</span></div>
        `).join('') || '<div class="vazio-lateral">Nenhuma entrada de dízimo/oferta nesse mês.</div>'}
      </div>
      ${Object.keys(porEvento).length ? `
        <h3 style="margin-top:24px;">Por evento ingressado</h3>
        <div class="lista-simples">
          ${Object.entries(porEvento).sort((a, b) => b[1] - a[1]).map(([titulo, valor]) => `
            <div class="linha-simples"><span>${escaparHtml(titulo)}</span><span class="valor-simples">R$ ${valor.toFixed(2)}</span></div>
          `).join('')}
        </div>` : ''}
      <h3 style="margin-top:24px;">Por semana</h3>
      <div class="lista-simples">
        ${Object.entries(porSemana).sort((a, b) => a[0].localeCompare(b[0])).map(([chave, s]) => {
          const fim = new Date(s.inicio);
          fim.setUTCDate(fim.getUTCDate() + 6);
          return `<div class="linha-simples"><span>${formatarDataCurtaUtc(s.inicio)} a ${formatarDataCurtaUtc(fim)}</span><span class="valor-simples">R$ ${s.total.toFixed(2)}</span></div>`;
        }).join('') || '<div class="vazio-lateral">Nenhuma entrada nesse mês.</div>'}
      </div>
      <h3 style="margin-top:24px;">Todas as transações do mês</h3>
      <div class="tabela-revisao-wrap">
        <table class="tabela-revisao">
          <thead>
            <tr><th>Nome</th><th>Categoria</th><th>Valor</th><th>Data</th><th>Banco</th><th>Meio</th></tr>
          </thead>
          <tbody>
            ${linhasDoMes.map(e => `
              <tr class="${e.motivo_sem_usuario ? 'linha-sem-usuario' : ''}">
                <td>${escaparHtml(e.profiles?.nome || labelMotivoEntrada(e.motivo_sem_usuario))}</td>
                <td>${LABEL_TIPO_ENTRADA[e.tipo || 'nao_especificado']}${e.eventos?.titulo ? ' · ' + escaparHtml(e.eventos.titulo) : ''}</td>
                <td style="white-space:nowrap;">R$ ${Number(e.valor).toFixed(2)}</td>
                <td style="white-space:nowrap;">${new Date(e.data).toLocaleDateString('pt-BR')}</td>
                <td>${LABEL_BANCO_EXTRATO[e.banco_origem] || 'Manual'}</td>
                <td>${LABEL_MEIO_EXTRATO[e.meio_pagamento] || e.meio_pagamento}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // =========================================================
  // Painel de Usuarios (Fase 5)
  // =========================================================
  // Os 3 blocos que a tela de Usuarios divide o "Por ministério/grupo".
  // Discipulado (grupo de casais + categoria Awake) nao usa isso --
  // ele vem de colunas diretas em profiles (grupo_casais/categoria),
  // ver LABEL_GRUPO_CASAIS/LABEL_CATEGORIA logo abaixo.
  const GRUPO_FAIXA_ETARIA = ['awake', 'homens', 'mulheres', 'criancas'];
  const GRUPO_SERVICO = ['diaconos', 'louvor', 'danca', 'midia', 'multimidia', 'teatro', 'coral', 'intercessao'];
  const LABEL_MINISTERIO_AGREGADO = {
    awake: 'Awake', homens: 'Homens', mulheres: 'Mulheres', criancas: 'Crianças',
    diaconos: 'Diáconos', louvor: 'Louvor', danca: 'Dança', midia: 'Mídia',
    multimidia: 'Multimídia', teatro: 'Teatro', coral: 'Coral', intercessao: 'Intercessão',
  };
  // Discipulado (Grupo de Casais) -- coluna direta em profiles, nao um
  // vinculo em profile_ministerios, e sem conceito de "lider" (o grupo
  // ja carrega o nome do casal que discipula no proprio label).
  const LABEL_GRUPO_CASAIS = {
    henrique_patricia: 'Grupo do Henrique e Patrícia',
    ivaldo_sonja: 'Grupo do Ivaldo e Sonja',
    marcelo_andreia: 'Grupo do Marcelo e Andréia',
  };
  const LABEL_CATEGORIA = { genesis: 'Genesis', next: 'Next', one: 'One' };

  // ---------- Visitantes -- Primeira Vez ----------

  let todosVisitantes = [];
  let todosUsuariosParaAcompanhamento = [];

  async function iniciarPainelVisitantes() {
    const dashEl = document.getElementById('dashboard-visitantes');
    dashEl.innerHTML = '<div class="vazio-lateral">Carregando...</div>';

    const [{ data: visitantes, error: erroVis }, { data: usuarios, error: erroUsu }] = await Promise.all([
      supa.from('visitantes_primeira_vez')
        .select('id, dados, lido, criado_em, acompanhado_por, primeiro_retorno, segundo_retorno, virou_membro')
        .order('criado_em', { ascending: false }),
      supa.from('profiles').select('id, nome').order('nome'),
    ]);

    if (erroVis || erroUsu) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml((erroVis || erroUsu).message)}</div>`;
      return;
    }

    todosVisitantes = visitantes || [];
    todosUsuariosParaAcompanhamento = usuarios || [];

    renderizarDashboardVisitantes();
    renderizarListaVisitantes();
    document.getElementById('busca-visitante').addEventListener('input', renderizarListaVisitantes);
  }

  function renderizarDashboardVisitantes() {
    const total = todosVisitantes.length;
    const retornaram1x = todosVisitantes.filter(v => v.primeiro_retorno).length;
    const retornaram2x = todosVisitantes.filter(v => v.segundo_retorno).length;
    const viraramMembro = todosVisitantes.filter(v => v.virou_membro).length;
    const taxaConversao = total ? Math.round((viraramMembro / total) * 100) : 0;

    document.getElementById('dashboard-visitantes').innerHTML = `
      <div class="grade-agregados">
        <div class="cartao-agregado"><div class="nome-agregado">Total de visitantes</div><div class="contagem-agregado">${total}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Retornaram (1ª vez)</div><div class="contagem-agregado">${retornaram1x}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Retornaram (2ª vez)</div><div class="contagem-agregado">${retornaram2x}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Viraram membro</div><div class="contagem-agregado">${viraramMembro} · ${taxaConversao}%</div></div>
      </div>`;
  }

  function renderizarListaVisitantes() {
    const busca = (document.getElementById('busca-visitante').value || '').trim().toLowerCase();
    const filtrados = busca
      ? todosVisitantes.filter(v => ((v.dados && v.dados['Nome completo']) || '').toLowerCase().includes(busca))
      : todosVisitantes;

    const listaEl = document.getElementById('lista-visitantes');
    if (filtrados.length === 0) {
      listaEl.innerHTML = '<div class="vazio-lateral">Nenhum visitante encontrado.</div>';
      return;
    }

    const opcoesUsuarios = todosUsuariosParaAcompanhamento
      .map(u => `<option value="${u.id}">${escaparHtml(u.nome)}</option>`)
      .join('');

    // Aglutina por dia (data de cadastro) -- a lista ja vem ordenada por
    // criado_em decrescente, entao so precisa detectar troca de dia
    // enquanto percorre, sem precisar reordenar nada.
    let ultimoDiaChave = null;
    listaEl.innerHTML = filtrados.map(v => {
      const dados = v.dados || {};
      const nome = dados['Nome completo'] || '(sem nome)';
      const contato = dados['Celular/WhatsApp'] || '';
      const situacao = dados['Situação de fé'] || '';
      const dataObj = new Date(v.criado_em);
      const dataCadastro = dataObj.toLocaleDateString('pt-BR');
      const detalhe = [contato, situacao].filter(Boolean).join(' · ');
      const badgeSemAcompanhamento = v.acompanhado_por
        ? ''
        : '<span class="badge badge-inativo">Sem acompanhamento</span>';

      const diaChave = dataCadastro; // dd/mm/aaaa ja basta como chave
      let cabecalhoDia = '';
      if (diaChave !== ultimoDiaChave) {
        ultimoDiaChave = diaChave;
        const rotuloDia = dataObj.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
        cabecalhoDia = `<div class="cabecalho-dia-visitantes">${escaparHtml(rotuloDia)}</div>`;
      }

      return `
        ${cabecalhoDia}
        <div class="linha-usuario">
          <span class="nome-usuario">${escaparHtml(nome)}</span>${badgeSemAcompanhamento}
          <div style="font-size:12px; color:#888; margin-top:2px;">
            ${detalhe ? escaparHtml(detalhe) + ' · ' : ''}cadastrado em ${dataCadastro}
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; align-items:flex-end;">
            <div class="campo-form" style="max-width:220px; margin:0;">
              <label>Acompanhado por</label>
              <select data-visitante-id="${v.id}" data-campo="acompanhado_por" class="select-acompanhamento">
                <option value="">Ninguém ainda</option>
                ${opcoesUsuarios}
              </select>
            </div>
            <div class="campo-form" style="max-width:160px; margin:0;">
              <label>Primeiro retorno</label>
              <input type="date" data-visitante-id="${v.id}" data-campo="primeiro_retorno"
                     class="input-acompanhamento" value="${v.primeiro_retorno || ''}">
            </div>
            <div class="campo-form" style="max-width:160px; margin:0;">
              <label>Segundo retorno</label>
              <input type="date" data-visitante-id="${v.id}" data-campo="segundo_retorno"
                     class="input-acompanhamento" value="${v.segundo_retorno || ''}">
            </div>
            <div class="campo-form check" style="margin:0;">
              <input type="checkbox" data-visitante-id="${v.id}" data-campo="virou_membro"
                     class="checkbox-acompanhamento" ${v.virou_membro ? 'checked' : ''}>
              <label>Virou membro</label>
            </div>
          </div>
          <div style="margin-top:10px; display:flex; gap:14px;">
            <button class="link-acao" data-visitante-id="${v.id}" data-acao-editar>Editar</button>
            <button class="link-acao link-acao-perigo" data-visitante-id="${v.id}" data-acao-apagar>Apagar</button>
          </div>
        </div>`;
    }).join('');

    listaEl.querySelectorAll('[data-acao-editar]').forEach(btn => {
      btn.addEventListener('click', () => abrirEdicaoVisitante(btn.dataset.visitanteId));
    });
    listaEl.querySelectorAll('[data-acao-apagar]').forEach(btn => {
      btn.addEventListener('click', () => apagarVisitante(btn.dataset.visitanteId));
    });

    // Preenche o valor selecionado do <select> depois de montar o HTML
    // (mais simples que montar "selected" dinamico dentro de cada <option>).
    listaEl.querySelectorAll('.select-acompanhamento').forEach(sel => {
      const visitante = todosVisitantes.find(v => v.id === sel.dataset.visitanteId);
      sel.value = visitante?.acompanhado_por || '';
      sel.addEventListener('change', () => salvarCampoAcompanhamento(sel, sel.value || null));
    });
    listaEl.querySelectorAll('.input-acompanhamento').forEach(input => {
      input.addEventListener('change', () => salvarCampoAcompanhamento(input, input.value || null));
    });
    listaEl.querySelectorAll('.checkbox-acompanhamento').forEach(chk => {
      chk.addEventListener('change', () => salvarCampoAcompanhamento(chk, chk.checked));
    });
  }

  async function salvarCampoAcompanhamento(elemento, valor) {
    const visitanteId = elemento.dataset.visitanteId;
    const campo = elemento.dataset.campo;

    const { error } = await supa.from('visitantes_primeira_vez').update({ [campo]: valor }).eq('id', visitanteId);
    if (error) {
      alert('Erro ao salvar: ' + error.message);
      return;
    }

    const visitante = todosVisitantes.find(v => v.id === visitanteId);
    if (visitante) visitante[campo] = valor;
    renderizarDashboardVisitantes();
    // So' o campo "acompanhado_por" muda a tarja "Sem acompanhamento" --
    // reusa o mesmo re-render pros outros campos tambem, mais simples
    // que reconstruir so' um pedacinho da linha.
    renderizarListaVisitantes();
  }

  // Campos de "dados" (respostas do formulario "Seja Bem-vindo!") que
  // fazem sentido corrigir manualmente -- ver formulario_visitante_
  // screen.dart no app pra ver os nomes exatos das chaves. Aqui vira
  // texto livre mesmo pros campos que no app sao select (Sexo/Situacao
  // de fe/Como conheceu) -- e' uma correcao administrativa, nao o
  // formulario publico, entao nao precisa replicar a mesma validacao.
  const CAMPOS_DADOS_VISITANTE = [
    { chave: 'Nome completo', tipo: 'text' },
    { chave: 'Celular/WhatsApp', tipo: 'text' },
    { chave: 'Data de nascimento', tipo: 'date' },
    { chave: 'Sexo', tipo: 'text' },
    { chave: 'Situação de fé', tipo: 'text' },
    { chave: 'Como conheceu', tipo: 'text' },
  ];

  function abrirEdicaoVisitante(visitanteId) {
    const v = todosVisitantes.find(x => x.id === visitanteId);
    if (!v) return;
    const dados = v.dados || {};

    document.getElementById('caixa-modal').innerHTML = `
      <button class="fechar-modal" id="fechar-modal">✕</button>
      <h2>Editar visitante</h2>
      ${CAMPOS_DADOS_VISITANTE.map(c => `
        <div class="campo-form">
          <label>${escaparHtml(c.chave)}</label>
          <input type="${c.tipo}" id="ev-${c.chave}" value="${escaparAtributo(dados[c.chave] || '')}">
        </div>
      `).join('')}
      <div id="erro-form-visitante" style="color:var(--vermelho); font-size:12px; margin-bottom:8px;"></div>
      <div class="acoes-modal">
        <button class="botao-secundario" id="btn-cancelar-visitante">Cancelar</button>
        <button class="botao-secundario" id="btn-salvar-visitante" style="background:var(--navy); color:#fff;">Salvar</button>
      </div>
    `;
    document.getElementById('fundo-modal').classList.add('aberto');
    document.getElementById('fechar-modal').addEventListener('click', fecharModal);
    document.getElementById('btn-cancelar-visitante').addEventListener('click', fecharModal);
    document.getElementById('btn-salvar-visitante').addEventListener('click', () => salvarEdicaoVisitante(visitanteId));
  }

  async function salvarEdicaoVisitante(visitanteId) {
    const v = todosVisitantes.find(x => x.id === visitanteId);
    if (!v) return;

    const nome = document.getElementById('ev-Nome completo').value.trim();
    if (!nome) {
      document.getElementById('erro-form-visitante').textContent = 'Informe o nome completo.';
      return;
    }

    // Mantem qualquer chave extra que ja existisse em "dados" e nao
    // esteja no formulario acima -- so sobrescreve o que foi editado.
    const novoDados = { ...(v.dados || {}) };
    CAMPOS_DADOS_VISITANTE.forEach(c => {
      novoDados[c.chave] = document.getElementById(`ev-${c.chave}`).value.trim();
    });

    const { error } = await supa.from('visitantes_primeira_vez').update({ dados: novoDados }).eq('id', visitanteId);
    if (error) {
      document.getElementById('erro-form-visitante').textContent = 'Erro ao salvar: ' + error.message;
      return;
    }

    v.dados = novoDados;
    fecharModal();
    renderizarListaVisitantes();
  }

  async function apagarVisitante(visitanteId) {
    const v = todosVisitantes.find(x => x.id === visitanteId);
    const nome = (v && v.dados && v.dados['Nome completo']) || 'esse visitante';
    if (!confirm(`Apagar o cadastro de "${nome}" permanentemente? Essa ação não pode ser desfeita.`)) return;

    const { error } = await supa.from('visitantes_primeira_vez').delete().eq('id', visitanteId);
    if (error) {
      alert('Erro ao apagar: ' + error.message);
      return;
    }

    todosVisitantes = todosVisitantes.filter(x => x.id !== visitanteId);
    renderizarDashboardVisitantes();
    renderizarListaVisitantes();
  }

  // ---------- Shallom: eventos gerais + contagem manual ----------

  /// EBD aparece nas duas abas (Awake e Shallom) -- "nao contabilizado"
  /// precisa ser independente por aba, senao marcar numa mexe na outra
  /// sem querer. Devolve um Set de chaves "eventoId_data" pra lookup
  /// rapido na hora de renderizar.
  async function buscarNaoContabilizadas(aba, eventoIds) {
    const { data, error } = await supa
      .from('ocorrencias_nao_contabilizadas')
      .select('evento_id, data_ocorrencia')
      .eq('aba', aba)
      .in('evento_id', eventoIds);
    if (error) throw error;
    return new Set((data || []).map(l => `${l.evento_id}_${l.data_ocorrencia}`));
  }

  let ocorrenciasShallom = [];
  let contagensShallom = [];
  let naoContabilizadasShallom = new Set();

  async function iniciarPainelShallom() {
    const dashEl = document.getElementById('dashboard-shallom');
    const listaEl = document.getElementById('lista-shallom');
    dashEl.innerHTML = '<div class="vazio-lateral">Carregando...</div>';
    listaEl.innerHTML = '';

    const hoje = hojeUtc();
    const inicioJanela = new Date(hoje);
    inicioJanela.setUTCDate(inicioJanela.getUTCDate() - 56); // ultimas 8 semanas

    const { data: eventos, error: erroEv } = await supa
      .from('eventos')
      .select('id, titulo, data_inicio, recorrente, recorrencia_fim, semanas_do_mes, tipo, excecoes')
      .in('tipo', ['ebd', 'culto_celebracao', 'culto_familia'])
      .order('data_inicio', { ascending: false });

    if (erroEv) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar eventos: ${escaparHtml(erroEv.message)}</div>`;
      return;
    }

    const ocorrencias = [];
    (eventos || []).forEach(ev => {
      ocorrenciasNoIntervalo(ev, inicioJanela, hoje).forEach(data => {
        ocorrencias.push({ evento: ev, data });
      });
    });
    ocorrencias.sort((a, b) => b.data - a.data);
    ocorrenciasShallom = ocorrencias;

    if (ocorrencias.length === 0) {
      dashEl.innerHTML = '<div class="vazio-lateral">Nenhum evento nas últimas 8 semanas.</div>';
      return;
    }

    const eventoIds = [...new Set(ocorrencias.map(o => o.evento.id))];
    const { data: contagens, error: erroCont } = await supa
      .from('contagem_manual_eventos')
      .select('evento_id, data_ocorrencia, contagem')
      .in('evento_id', eventoIds);

    if (erroCont) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar contagem: ${escaparHtml(erroCont.message)}</div>`;
      return;
    }
    contagensShallom = contagens || [];

    try {
      naoContabilizadasShallom = await buscarNaoContabilizadas('shallom', eventoIds);
    } catch (e) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml(e.message)}</div>`;
      return;
    }

    renderizarDashboardShallom();
    renderizarListaShallom();
  }

  function _contagemDaOcorrencia(oc) {
    const dataStr = oc.data.toISOString().slice(0, 10);
    const linha = contagensShallom.find(c => c.evento_id === oc.evento.id && c.data_ocorrencia === dataStr);
    return linha ? linha.contagem : 0;
  }

  function _naoContabilizadoShallom(oc) {
    const dataStr = oc.data.toISOString().slice(0, 10);
    return naoContabilizadasShallom.has(`${oc.evento.id}_${dataStr}`);
  }

  function renderizarDashboardShallom() {
    // Evento marcado "nao contabilizado" continua na lista, mas sai
    // inteiro da conta (nem entra no total de eventos, nem no total de
    // presencas, nem na media).
    const ocorrenciasContadas = ocorrenciasShallom.filter(oc => !_naoContabilizadoShallom(oc));
    const totalOcorrencias = ocorrenciasContadas.length;
    const totalPresencas = ocorrenciasContadas.reduce((soma, oc) => soma + _contagemDaOcorrencia(oc), 0);
    const media = totalOcorrencias ? totalPresencas / totalOcorrencias : 0;

    document.getElementById('dashboard-shallom').innerHTML = `
      <div class="grade-agregados">
        <div class="cartao-agregado"><div class="nome-agregado">Eventos (últimas 8 semanas)</div><div class="contagem-agregado">${totalOcorrencias}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Total de presenças</div><div class="contagem-agregado">${totalPresencas}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Média de presença por evento</div><div class="contagem-agregado">${media.toFixed(1)}</div></div>
      </div>`;
  }

  function renderizarListaShallom() {
    const listaEl = document.getElementById('lista-shallom');
    let semanaAtualChave = null;

    listaEl.innerHTML = ocorrenciasShallom.map(oc => {
      const dataStr = oc.data.toISOString().slice(0, 10);
      const contagem = _contagemDaOcorrencia(oc);
      const naoContabilizado = _naoContabilizadoShallom(oc);

      const inicioSemana = inicioDaSemanaUtc(oc.data);
      const semanaChave = inicioSemana.toISOString().slice(0, 10);
      let cabecalhoSemana = '';
      if (semanaChave !== semanaAtualChave) {
        semanaAtualChave = semanaChave;
        const fimSemana = new Date(inicioSemana);
        fimSemana.setUTCDate(fimSemana.getUTCDate() + 6);
        cabecalhoSemana = `<div class="cabecalho-dia-visitantes">Semana de ${inicioSemana.toLocaleDateString('pt-BR', OPCOES_FUSO_UTC)} a ${fimSemana.toLocaleDateString('pt-BR', OPCOES_FUSO_UTC)}</div>`;
      }

      const badge = naoContabilizado
        ? `<span class="badge badge-neutro">Não contabilizado</span>`
        : `<span class="badge badge-checkin">${contagem} ${contagem === 1 ? 'veio' : 'vieram'}</span>`;

      return `
        ${cabecalhoSemana}
        <div class="linha-usuario" ${naoContabilizado ? 'style="opacity:0.6;"' : ''}>
          <span class="nome-usuario">${escaparHtml(oc.evento.titulo)}</span>${badge}
          <div style="font-size:12px; color:#888; margin-top:2px;">
            ${oc.data.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', ...OPCOES_FUSO_UTC })}
          </div>
          <div style="margin-top:10px; display:flex; gap:14px;">
            <button class="link-acao" data-evento-id="${oc.evento.id}" data-data="${dataStr}" data-titulo="${escaparAtributo(oc.evento.titulo)}" data-contagem="${contagem}" data-acao-editar-shallom>Editar</button>
            <button class="link-acao ${naoContabilizado ? '' : 'link-acao-perigo'}" data-evento-id="${oc.evento.id}" data-data="${dataStr}" data-nao-contabilizado="${naoContabilizado}" data-acao-nao-contabilizado-shallom>${naoContabilizado ? 'Contabilizar de novo' : 'Não contabilizado'}</button>
          </div>
        </div>`;
    }).join('');

    listaEl.querySelectorAll('[data-acao-editar-shallom]').forEach(btn => {
      btn.addEventListener('click', () => abrirEdicaoContagemShallom(btn.dataset.eventoId, btn.dataset.data, btn.dataset.titulo, Number(btn.dataset.contagem)));
    });
    listaEl.querySelectorAll('[data-acao-nao-contabilizado-shallom]').forEach(btn => {
      btn.addEventListener('click', () => alternarNaoContabilizado(
        btn.dataset.eventoId, btn.dataset.data, 'shallom', btn.dataset.naoContabilizado !== 'true', iniciarPainelShallom
      ));
    });
  }

  async function abrirEdicaoContagemShallom(eventoId, dataStr, titulo, contagemAtual) {
    document.getElementById('caixa-modal').innerHTML = `
      <button class="fechar-modal" id="fechar-modal">✕</button>
      <h2>Editar contagem — ${escaparHtml(titulo)}</h2>
      <div class="campo-form">
        <label>Quantas pessoas vieram</label>
        <input type="number" id="ec-contagem" min="0" value="${contagemAtual}">
      </div>
      <div id="erro-form-contagem" style="color:var(--vermelho); font-size:12px; margin-bottom:8px;"></div>
      <div class="acoes-modal">
        <button class="botao-secundario" id="btn-cancelar-contagem">Cancelar</button>
        <button class="botao-secundario" id="btn-salvar-contagem" style="background:var(--navy); color:#fff;">Salvar</button>
      </div>
    `;
    document.getElementById('fundo-modal').classList.add('aberto');
    document.getElementById('fechar-modal').addEventListener('click', fecharModal);
    document.getElementById('btn-cancelar-contagem').addEventListener('click', fecharModal);
    document.getElementById('btn-salvar-contagem').addEventListener('click', async () => {
      const valor = Number(document.getElementById('ec-contagem').value);
      if (!Number.isInteger(valor) || valor < 0) {
        document.getElementById('erro-form-contagem').textContent = 'Informe um número inteiro, 0 ou mais.';
        return;
      }
      const { error } = await supa.rpc('definir_contagem_evento', {
        p_evento_id: eventoId,
        p_data_ocorrencia: dataStr,
        p_valor: valor,
      });
      if (error) {
        document.getElementById('erro-form-contagem').textContent = 'Erro ao salvar: ' + error.message;
        return;
      }
      fecharModal();
      await iniciarPainelShallom();
    });
  }

  // ---------- Awake: eventos + check-ins ----------

  let ocorrenciasAwake = []; // [{ evento, data }], mais recente primeiro
  let presencasAwake = [];
  let naoContabilizadasAwake = new Set();

  function inicioDaSemanaUtc(data) {
    const d = new Date(data);
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d;
  }

  async function iniciarPainelAwake() {
    const dashEl = document.getElementById('dashboard-awake');
    const listaEl = document.getElementById('lista-awake');
    dashEl.innerHTML = '<div class="vazio-lateral">Carregando...</div>';
    listaEl.innerHTML = '';

    const hoje = hojeUtc();
    const inicioJanela = new Date(hoje);
    inicioJanela.setUTCDate(inicioJanela.getUTCDate() - 56); // ultimas 8 semanas

    // Filtra por TIPO, nao por escopo -- so os encontros "oficiais"
    // (EBD vem de escopo=igreja; GC/Comunhao/Laje vem de escopo=awake).
    // Fica de fora Culto de Celebracao/Culto da Familia (escopo=igreja)
    // e qualquer evento tipo=outro dentro do Awake (ex: "Entre Elas",
    // "Lançamento do Aplicativo") -- pedido explicito do Leo.
    const { data: eventos, error: erroEv } = await supa
      .from('eventos')
      .select('id, titulo, data_inicio, recorrente, recorrencia_fim, semanas_do_mes, tipo, excecoes')
      .in('tipo', ['ebd', 'gc', 'comunhao', 'laje'])
      .order('data_inicio', { ascending: false });

    if (erroEv) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar eventos: ${escaparHtml(erroEv.message)}</div>`;
      return;
    }

    // Reaproveita a mesma logica de recorrencia do Calendario -- monta
    // cada ocorrencia (evento + data especifica) dentro da janela.
    const ocorrencias = [];
    (eventos || []).forEach(ev => {
      ocorrenciasNoIntervalo(ev, inicioJanela, hoje).forEach(data => {
        ocorrencias.push({ evento: ev, data });
      });
    });
    ocorrencias.sort((a, b) => b.data - a.data);
    ocorrenciasAwake = ocorrencias;

    if (ocorrencias.length === 0) {
      dashEl.innerHTML = '<div class="vazio-lateral">Nenhum evento Awake nas últimas 8 semanas.</div>';
      return;
    }

    const eventoIds = [...new Set(ocorrencias.map(o => o.evento.id))];
    const dataMaisAntiga = ocorrencias[ocorrencias.length - 1].data.toISOString().slice(0, 10);
    // profiles!presencas_eventos_user_id_fkey -- precisa qualificar
    // qual FK usar: a tabela tem DUAS ligacoes com profiles (user_id
    // de quem fez check-in, e feito_por de quem confirmou), entao um
    // embed sem qualificar ("profiles(nome)") fica ambiguo pro
    // PostgREST e a consulta e' rejeitada (mesmo bug ja corrigido em
    // visitante_service.dart no app, ver commit "Corrige lista de
    // Visitantes vazia").
    const { data: presencas, error: erroPres } = await supa
      .from('presencas_eventos')
      .select('evento_id, data_ocorrencia, profiles!presencas_eventos_user_id_fkey(nome)')
      .in('evento_id', eventoIds)
      .gte('data_ocorrencia', dataMaisAntiga);

    if (erroPres) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar check-ins: ${escaparHtml(erroPres.message)}</div>`;
      return;
    }
    presencasAwake = presencas || [];

    try {
      naoContabilizadasAwake = await buscarNaoContabilizadas('awake', eventoIds);
    } catch (e) {
      dashEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml(e.message)}</div>`;
      return;
    }

    renderizarDashboardAwake();
    renderizarListaAwake();
  }

  function _naoContabilizadoAwake(oc) {
    const dataStr = oc.data.toISOString().slice(0, 10);
    return naoContabilizadasAwake.has(`${oc.evento.id}_${dataStr}`);
  }

  function renderizarDashboardAwake() {
    // Evento marcado "nao contabilizado" continua na lista, mas sai
    // inteiro da conta (nem entra no total de eventos, nem no total de
    // check-ins, nem na media).
    const ocorrenciasContadas = ocorrenciasAwake.filter(oc => !_naoContabilizadoAwake(oc));
    const totalOcorrencias = ocorrenciasContadas.length;
    const dataStrsContadas = new Set(ocorrenciasContadas.map(oc => `${oc.evento.id}_${oc.data.toISOString().slice(0, 10)}`));
    const totalCheckins = presencasAwake.filter(p => dataStrsContadas.has(`${p.evento_id}_${p.data_ocorrencia}`)).length;
    const media = totalOcorrencias ? totalCheckins / totalOcorrencias : 0;

    document.getElementById('dashboard-awake').innerHTML = `
      <div class="grade-agregados">
        <div class="cartao-agregado"><div class="nome-agregado">Eventos (últimas 8 semanas)</div><div class="contagem-agregado">${totalOcorrencias}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Total de check-ins</div><div class="contagem-agregado">${totalCheckins}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Média de presença por evento</div><div class="contagem-agregado">${media.toFixed(1)}</div></div>
      </div>`;
  }

  function renderizarListaAwake() {
    const listaEl = document.getElementById('lista-awake');
    let semanaAtualChave = null;

    listaEl.innerHTML = ocorrenciasAwake.map(oc => {
      const dataStr = oc.data.toISOString().slice(0, 10);
      const presencasDoEvento = presencasAwake.filter(
        p => p.evento_id === oc.evento.id && p.data_ocorrencia === dataStr
      );
      const nomes = presencasDoEvento
        .map(p => (p.profiles && p.profiles.nome) || '(sem nome)')
        .sort();
      const naoContabilizado = _naoContabilizadoAwake(oc);

      const inicioSemana = inicioDaSemanaUtc(oc.data);
      const semanaChave = inicioSemana.toISOString().slice(0, 10);
      let cabecalhoSemana = '';
      if (semanaChave !== semanaAtualChave) {
        semanaAtualChave = semanaChave;
        const fimSemana = new Date(inicioSemana);
        fimSemana.setUTCDate(fimSemana.getUTCDate() + 6);
        cabecalhoSemana = `<div class="cabecalho-dia-visitantes">Semana de ${inicioSemana.toLocaleDateString('pt-BR', OPCOES_FUSO_UTC)} a ${fimSemana.toLocaleDateString('pt-BR', OPCOES_FUSO_UTC)}</div>`;
      }

      const badge = naoContabilizado
        ? `<span class="badge badge-neutro">Não contabilizado</span>`
        : `<span class="badge badge-checkin">${presencasDoEvento.length} ${presencasDoEvento.length === 1 ? 'veio' : 'vieram'}</span>`;

      return `
        ${cabecalhoSemana}
        <div class="linha-usuario" ${naoContabilizado ? 'style="opacity:0.6;"' : ''}>
          <span class="nome-usuario">${escaparHtml(oc.evento.titulo)}</span>${badge}
          <div style="font-size:12px; color:#888; margin-top:2px;">
            ${oc.data.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', ...OPCOES_FUSO_UTC })}
          </div>
          ${nomes.length
            ? `<div style="font-size:12px; color:var(--navy); margin-top:8px;">${nomes.map(escaparHtml).join(', ')}</div>`
            : `<div style="font-size:12px; color:#aaa; margin-top:8px;">Ninguém fez check-in.</div>`}
          <div style="margin-top:10px; display:flex; gap:14px;">
            <button class="link-acao" data-evento-id="${oc.evento.id}" data-data="${dataStr}" data-titulo="${escaparAtributo(oc.evento.titulo)}" data-acao-editar-awake>Editar</button>
            <button class="link-acao ${naoContabilizado ? '' : 'link-acao-perigo'}" data-evento-id="${oc.evento.id}" data-data="${dataStr}" data-nao-contabilizado="${naoContabilizado}" data-acao-nao-contabilizado-awake>${naoContabilizado ? 'Contabilizar de novo' : 'Não contabilizado'}</button>
          </div>
        </div>`;
    }).join('');

    listaEl.querySelectorAll('[data-acao-editar-awake]').forEach(btn => {
      btn.addEventListener('click', () => abrirEdicaoCheckinAwake(btn.dataset.eventoId, btn.dataset.data, btn.dataset.titulo));
    });
    listaEl.querySelectorAll('[data-acao-nao-contabilizado-awake]').forEach(btn => {
      btn.addEventListener('click', () => alternarNaoContabilizado(
        btn.dataset.eventoId, btn.dataset.data, 'awake', btn.dataset.naoContabilizado !== 'true', iniciarPainelAwake
      ));
    });
  }

  /// Marca (ou desmarca) uma ocorrencia como "nao contabilizada" --
  /// SEMPRE so' pra [aba] (evento tipo EBD aparece nas duas abas, e a
  /// marcacao precisa ser independente entre elas -- ver
  /// ocorrencias_nao_contabilizadas). O evento continua na lista, so'
  /// sai da contagem/media do dashboard DAQUELA aba. Compartilhada
  /// entre Awake e Shallom -- [aoTerminar] recarrega a lista certa.
  async function alternarNaoContabilizado(eventoId, dataStr, aba, novoValor, aoTerminar) {
    const { error } = await supa.rpc('definir_nao_contabilizado_evento', {
      p_evento_id: eventoId,
      p_data_ocorrencia: dataStr,
      p_aba: aba,
      p_nao_contabilizado: novoValor,
    });
    if (error) {
      alert('Erro ao salvar: ' + error.message);
      return;
    }
    await aoTerminar();
  }

    document.getElementById('caixa-modal').innerHTML = `
      <button class="fechar-modal" id="fechar-modal">✕</button>

  // ---------- Status do robô de teste ----------

  let _statusRodadas = [];
  let _statusRodadaSelecionada = null;

  async function iniciarPainelStatus() {
    const resumoEl = document.getElementById('status-resumo');
    resumoEl.innerHTML = '<div class="vazio-lateral">Carregando...</div>';
    document.getElementById('status-historico').innerHTML = '';
    document.getElementById('status-detalhe').innerHTML = '';

    // As ~58 checagens de uma rodada tem criado_em quase identico --
    // busca as ultimas ~3000 linhas (~50 rodadas) e agrupa por
    // rodada_id no proprio JS (nao da pra fazer GROUP BY pelo
    // query builder do supabase-js).
    const { data: linhas, error } = await supa
      .from('testes_automatizados_execucoes')
      .select('rodada_id, nome_teste, sucesso, erro, duracao_ms, criado_em')
      .order('criado_em', { ascending: false })
      .limit(3000);

    if (error) {
      resumoEl.innerHTML = `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml(error.message)}</div>`;
      return;
    }
    if (!linhas || linhas.length === 0) {
      resumoEl.innerHTML = '<div class="vazio-lateral">O robô ainda não rodou nenhuma vez.</div>';
      return;
    }

    const porId = {};
    const rodadas = [];
    linhas.forEach(l => {
      let rodada = porId[l.rodada_id];
      if (!rodada) {
        rodada = { id: l.rodada_id, checagens: [], em: l.criado_em };
        porId[l.rodada_id] = rodada;
        rodadas.push(rodada);
      }
      rodada.checagens.push(l);
      if (l.criado_em > rodada.em) rodada.em = l.criado_em;
    });
    rodadas.sort((a, b) => (a.em < b.em ? 1 : -1));

    _statusRodadas = rodadas;
    _statusRodadaSelecionada = rodadas[0].id;
    renderizarStatusResumo();
    renderizarStatusHistorico();
  }

  function _rodadaSelecionada() {
    return _statusRodadas.find(r => r.id === _statusRodadaSelecionada) || _statusRodadas[0];
  }

  function renderizarStatusResumo() {
    const atual = _rodadaSelecionada();
    const total = atual.checagens.length;
    const falharam = atual.checagens.filter(c => !c.sucesso).length;
    const passaram = total - falharam;
    const tudoOk = falharam === 0;
    const cor = tudoOk ? '#1b8a3f' : '#c0392b';

    document.getElementById('status-resumo').innerHTML = `
      <div class="cartao-agregado" style="max-width:400px; border-left: 6px solid ${cor};">
        <div class="nome-agregado">
          ${tudoOk ? '✅ Tudo passando' : `⚠️ ${falharam} checagem(ns) falhando`} --
          rodada de ${new Date(atual.em).toLocaleString('pt-BR')}
        </div>
        <div class="contagem-agregado" style="color:${cor};">${passaram}/${total}</div>
      </div>`;

    document.getElementById('status-titulo-detalhe').textContent =
      `Detalhe da rodada de ${new Date(atual.em).toLocaleString('pt-BR')}`;

    document.getElementById('status-detalhe').innerHTML = atual.checagens
      .slice()
      .sort((a, b) => (a.sucesso === b.sucesso ? 0 : a.sucesso ? 1 : -1))
      .map(c => `
        <div class="linha-usuario" style="border-left: 4px solid ${c.sucesso ? '#1b8a3f' : '#c0392b'};">
          <span class="nome-usuario">${c.sucesso ? '✅' : '❌'} ${escaparHtml(c.nome_teste)}</span>
          <span style="float:right; font-size:12px; color:#888;">${c.duracao_ms}ms</span>
          ${c.erro ? `<div style="font-size:12px; color:#c0392b; margin-top:6px; clear:both;">${escaparHtml(c.erro)}</div>` : ''}
        </div>`)
      .join('');
  }

  function renderizarStatusHistorico() {
    document.getElementById('status-historico').innerHTML = _statusRodadas.slice(0, 15).map(r => {
      const falharam = r.checagens.filter(c => !c.sucesso).length;
      const cor = falharam === 0 ? '#1b8a3f' : '#c0392b';
      const ativa = r.id === _statusRodadaSelecionada;
      return `
        <button type="button" class="botao-secundario" data-rodada="${r.id}"
                style="display:block; width:100%; max-width:400px; text-align:left; margin-bottom:6px;
                       ${ativa ? 'border-color:#0C192E; border-width:2px;' : ''}">
          <span style="color:${cor}; font-weight:700;">${r.checagens.length - falharam}/${r.checagens.length}</span>
          &nbsp;&nbsp;${new Date(r.em).toLocaleString('pt-BR')}
        </button>`;
    }).join('');

    document.querySelectorAll('#status-historico [data-rodada]').forEach(btn => {
      btn.addEventListener('click', () => {
        _statusRodadaSelecionada = btn.dataset.rodada;
        renderizarStatusResumo();
        renderizarStatusHistorico();
      });
    });
  }

  let todosUsuarios = [];
  let todosVinculosMinisterio = [];

  async function iniciarPainelUsuarios() {
    const [{ data: perfis, error: erroPerfis }, { data: vinculos, error: erroVinculos }] = await Promise.all([
      supa.from('profiles')
        .select(
          'id, nome, telefone, endereco, sexo, papel, ativo, categoria, grupo_casais, '
          + 'data_nascimento, estado_civil, criado_em',
        )
        .order('nome'),
      supa.from('profile_ministerios').select('profile_id, ministerio, papel'),
    ]);

    if (erroPerfis || erroVinculos) {
      document.getElementById('lista-usuarios').innerHTML =
        `<div class="vazio-lateral">Erro ao carregar: ${escaparHtml((erroPerfis || erroVinculos).message)}</div>`;
      return;
    }

    todosUsuarios = perfis || [];
    todosVinculosMinisterio = vinculos || [];

    // E-mail vive em auth.users, nao em profiles -- so' admin consegue
    // ler (RPC com security definer), por isso busca separado e junta
    // por id. Se der erro (ex: SQL da funcao ainda nao rodou), so'
    // segue sem e-mail em vez de travar a tela inteira.
    const { data: emails } = await supa.rpc('admin_listar_emails');
    if (emails) {
      const mapaEmail = Object.fromEntries(emails.map(e => [e.id, e.email]));
      todosUsuarios.forEach(p => { p.email = mapaEmail[p.id] || null; });

    renderizarVisaoGeral();
    renderizarAgregados();
    renderizarListaUsuarios();
