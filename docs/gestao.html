  const FAIXAS_ETARIAS_ADMIN = ['awake', 'homens', 'mulheres', 'criancas'];
  const MINISTERIOS_SERVICO_ADMIN = ['diaconos', 'louvor', 'danca', 'midia', 'multimidia'];
  const LABEL_ESTADO_CIVIL_ADMIN = {
    solteiro: 'Solteiro(a)', namorando: 'Namorando', noivo: 'Noivo(a)',
    casado: 'Casado(a)', outro: 'Outro', nao_informado: 'Não informado',
  };

  function calcularIdadeAdmin(dataNascStr, hoje) {
    const nasc = new Date(dataNascStr);
    let idade = hoje.getFullYear() - nasc.getFullYear();
    if (hoje.getMonth() < nasc.getMonth() || (hoje.getMonth() === nasc.getMonth() && hoje.getDate() < nasc.getDate())) {
      idade--;
    }
    return idade;
  }

  function linhaBarraAdmin(rotulo, valor, total) {
    const pct = total ? Math.round((valor / total) * 100) : 0;
    return `
      <div class="linha-simples" style="display:block;">
        <div style="display:flex; justify-content:space-between;">
          <span>${escaparHtml(rotulo)}</span>
          <span class="valor-simples">${valor} · ${pct}%</span>
        </div>
        <div class="barra-progresso-simples"><div class="preenchido" style="width:${pct}%;"></div></div>
      </div>`;
  }

  async function renderizarVisaoGeral() {
    const el = document.getElementById('visao-geral-usuarios');
    el.innerHTML = '<div class="vazio-lateral">Calculando...</div>';

    const hoje = new Date();
    const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);

    const totalUsuarios = todosUsuarios.length;
    const novosNoMes = todosUsuarios.filter(p => p.criado_em && new Date(p.criado_em) >= inicioMes).length;

    const idades = todosUsuarios.filter(p => p.data_nascimento).map(p => calcularIdadeAdmin(p.data_nascimento, hoje));
    const idadeMedia = idades.length ? Math.round(idades.reduce((a, b) => a + b, 0) / idades.length) : null;

    const contagemEstadoCivil = {};
    todosUsuarios.forEach(p => {
      const chave = p.estado_civil || 'nao_informado';
      contagemEstadoCivil[chave] = (contagemEstadoCivil[chave] || 0) + 1;
    });

    const contagemFaixaEtaria = {};
    const contagemAreaServico = {};
    todosVinculosMinisterio.forEach(v => {
      if (FAIXAS_ETARIAS_ADMIN.includes(v.ministerio)) {
        contagemFaixaEtaria[v.ministerio] = (contagemFaixaEtaria[v.ministerio] || 0) + 1;
      } else if (MINISTERIOS_SERVICO_ADMIN.includes(v.ministerio)) {
        contagemAreaServico[v.ministerio] = (contagemAreaServico[v.ministerio] || 0) + 1;
      }
    });

    // Ranking combinado (todas as areas de servico juntas), ultimos 60
    // dias -- comeca todo mundo que esta em alguma area de servico com
    // 0, pra tambem aparecer quem nunca foi escalado.
    const contagemServindo = {};
    todosVinculosMinisterio
      .filter(v => MINISTERIOS_SERVICO_ADMIN.includes(v.ministerio))
      .forEach(v => {
        const nome = todosUsuarios.find(p => p.id === v.profile_id)?.nome;
        if (nome) contagemServindo[nome] = contagemServindo[nome] || 0;
      });

    const seiscentosDiasAtras = new Date(hoje.getTime() - 60 * 24 * 60 * 60 * 1000);
    const { data: escalas } = await supa
      .from('escalas_servico')
      .select('id')
      .in('ministerio', MINISTERIOS_SERVICO_ADMIN)
      .gte('data_ocorrencia', seiscentosDiasAtras.toISOString().split('T')[0]);

    if (escalas && escalas.length) {
      const escalaIds = escalas.map(e => e.id);
      const { data: posicoes } = await supa
        .from('escala_servico_posicoes')
        .select(
          'profile_id, profile_id_2, '
          + 'profiles!escala_servico_posicoes_profile_id_fkey(nome), '
          + 'profiles2:profiles!escala_servico_posicoes_profile_id_2_fkey(nome)',
        )
        .in('escala_id', escalaIds);

      (posicoes || []).forEach(p => {
        const nome1 = p.profiles?.nome;
        const nome2 = p.profiles2?.nome;
        if (nome1) contagemServindo[nome1] = (contagemServindo[nome1] || 0) + 1;
        if (nome2) contagemServindo[nome2] = (contagemServindo[nome2] || 0) + 1;
      });
    }

    const totalNaAreaServico = Object.keys(contagemServindo).length;
    const quantosServindo = Object.values(contagemServindo).filter(v => v > 0).length;
    const entradasRanking = Object.entries(contagemServindo).sort((a, b) => b[1] - a[1]);
    const maisAtivos = entradasRanking.slice(0, 10);
    const menosAtivos = entradasRanking.slice(-10).reverse();

    const listaRanking = (entradas) => entradas.length
      ? `<div class="lista-simples">${entradas.map(([nome, qtd]) => `
          <div class="linha-simples"><span>${escaparHtml(nome)}</span><span class="valor-simples">${qtd}x</span></div>
        `).join('')}</div>`
      : '<div class="vazio-lateral">Sem dados ainda.</div>';

    el.innerHTML = `
      <div class="grade-agregados" style="margin-bottom:16px;">
        <div class="cartao-agregado"><div class="nome-agregado">Usuários no total</div><div class="contagem-agregado">${totalUsuarios}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Novos esse mês</div><div class="contagem-agregado">${novosNoMes}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Idade média</div><div class="contagem-agregado">${idadeMedia ?? '—'}</div></div>
        <div class="cartao-agregado"><div class="nome-agregado">Servindo (áreas de serviço)</div><div class="contagem-agregado">${totalNaAreaServico ? Math.round((quantosServindo / totalNaAreaServico) * 100) + '%' : '—'}</div></div>
      </div>
      <div class="duas-colunas">
        <div>
          <h4 style="margin:0 0 8px;">Estado civil</h4>
          <div class="lista-simples">
            ${Object.entries(contagemEstadoCivil).sort((a, b) => b[1] - a[1])
              .map(([chave, qtd]) => linhaBarraAdmin(LABEL_ESTADO_CIVIL_ADMIN[chave] || chave, qtd, totalUsuarios)).join('')}
          </div>
        </div>
        <div>
          <h4 style="margin:0 0 8px;">Faixa etária</h4>
          <div class="lista-simples">
            ${Object.entries(contagemFaixaEtaria).sort((a, b) => b[1] - a[1])
              .map(([chave, qtd]) => linhaBarraAdmin(LABEL_MINISTERIO_AGREGADO[chave] || chave, qtd, totalUsuarios)).join('')}
          </div>
        </div>
      </div>
      <div style="margin-bottom:24px;">
        <h4 style="margin:0 0 8px;">Área de serviço</h4>
        <div class="lista-simples">
          ${Object.entries(contagemAreaServico).sort((a, b) => b[1] - a[1])
            .map(([chave, qtd]) => linhaBarraAdmin(LABEL_MINISTERIO_AGREGADO[chave] || chave, qtd, totalUsuarios)).join('')}
        </div>
      </div>
      <div class="duas-colunas">
        <div>
          <h4 style="margin:0 0 8px;">Mais participativos (últimos 60 dias, todas as áreas)</h4>
          ${listaRanking(maisAtivos)}
        </div>
        <div>
          <h4 style="margin:0 0 8px;">Menos participativos (últimos 60 dias, todas as áreas)</h4>
          ${listaRanking(menosAtivos)}
        </div>
      </div>`;
  }

  function cartaoMinisterioAgregado(ministerio) {
    const vinculosDoMinisterio = todosVinculosMinisterio.filter(v => v.ministerio === ministerio);
    const lideres = vinculosDoMinisterio
      .filter(v => v.papel === 'lider')
      .map(v => todosUsuarios.find(p => p.id === v.profile_id)?.nome)
      .filter(Boolean);
    return `
      <div class="cartao-agregado">
        <div class="nome-agregado">${LABEL_MINISTERIO_AGREGADO[ministerio]}</div>
        <div class="contagem-agregado">${vinculosDoMinisterio.length}</div>
        <div class="lideres-agregado">${lideres.length ? 'Líder: ' + escaparHtml(lideres.join(', ')) : 'Sem líder definido'}</div>
      </div>`;
  }

  function renderizarAgregados() {
    const el = document.getElementById('agregados-usuarios');

    const cartoesFaixaEtaria = GRUPO_FAIXA_ETARIA.map(cartaoMinisterioAgregado).join('');

    // Discipulado Casais = coluna grupo_casais, direto em profiles.
    const cartoesCasais = Object.entries(LABEL_GRUPO_CASAIS).map(([valor, label]) => {
      const qtd = todosUsuarios.filter(p => p.grupo_casais === valor).length;
      return `<div class="cartao-agregado"><div class="nome-agregado">${label}</div><div class="contagem-agregado">${qtd}</div></div>`;
    }).join('');

    // Discipulado Awake = coluna categoria -- MAS categoria e calculada
    // pra QUALQUER perfil (a partir de estado civil/idade), nao so pra
    // quem e do Awake -- um casado de Homens/Mulheres tambem recebe
    // categoria='one' no banco, mesmo Genesis/Next/One so fazendo
    // sentido dentro do Awake. Por isso filtra tambem por vinculo com
    // 'awake' em profile_ministerios, senao "One" conta casal que nem
    // e do Awake.
    const idsDoAwake = new Set(
      todosVinculosMinisterio.filter(v => v.ministerio === 'awake').map(v => v.profile_id),
    );
    const cartoesCategoria = Object.entries(LABEL_CATEGORIA).map(([valor, label]) => {
      const qtd = todosUsuarios.filter(p => p.categoria === valor && idsDoAwake.has(p.id)).length;
      return `<div class="cartao-agregado"><div class="nome-agregado">${label}</div><div class="contagem-agregado">${qtd}</div></div>`;
    }).join('');

    const cartoesServico = GRUPO_SERVICO.map(cartaoMinisterioAgregado).join('');

    el.innerHTML = `
      <h4 style="margin:0 0 8px;">Ministério de faixas etárias</h4>
      <div class="grade-agregados" style="margin-bottom:24px;">${cartoesFaixaEtaria}</div>
      <h4 style="margin:0 0 8px;">Discipulado Casais</h4>
      <div class="grade-agregados" style="margin-bottom:24px;">${cartoesCasais}</div>
      <h4 style="margin:0 0 8px;">Discipulado Awake</h4>
      <div class="grade-agregados" style="margin-bottom:24px;">${cartoesCategoria}</div>
      <h4 style="margin:0 0 8px;">Ministérios de serviço</h4>
      <div class="grade-agregados">${cartoesServico}</div>
    `;
  }

              ${opcoesNovoMinisterio}
            </select>
            <button type="button" class="botao-secundario" style="flex:none; padding:5px 10px; font-size:12px;"
                    data-acao="adicionar-membro" data-profile-id="${pessoa.id}">+ Membro</button>
            <button type="button" class="botao-secundario" style="flex:none; padding:5px 10px; font-size:12px;"
                    data-acao="adicionar-lider" data-profile-id="${pessoa.id}">+ Líder</button>`
        : '';

      return `
        <div class="linha-usuario">
          <span class="nome-usuario">${escaparHtml(pessoa.nome || '(sem nome)')}</span>${badgePapel}${badgeInativo}
          ${pessoa.email ? `<div style="font-size:12px; color:#888;">${escaparHtml(pessoa.email)}</div>` : ''}
          <div class="chips-ministerios">${chipsMinisterios}${chipCasal}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;">
            <button type="button" class="botao-secundario" style="flex:none; padding:5px 10px; font-size:12px;"
                    data-acao="editar" data-profile-id="${pessoa.id}">Editar perfil</button>
            <button type="button" class="botao-secundario" style="flex:none; padding:5px 10px; font-size:12px;"
                    data-acao="admin" data-profile-id="${pessoa.id}" data-eh-admin="${ehAdminAtual}">
              ${ehAdminAtual ? 'Remover admin' : 'Tornar admin'}
            </button>
            <button type="button" class="botao-secundario botao-perigo" style="flex:none; padding:5px 10px; font-size:12px;"
                    data-acao="apagar" data-profile-id="${pessoa.id}">Apagar conta</button>
            ${seletorNovoMinisterio}
          </div>
        </div>`;
    }).join('');

    listaEl.querySelectorAll('.chip-ministerio').forEach(chip => {
      chip.addEventListener('click', () => alternarLiderMinisterio(chip));
    });
    listaEl.querySelectorAll('.botao-remover-ministerio').forEach(btn => {
      btn.addEventListener('click', () => removerDoMinisterio(btn.dataset.profileId, btn.dataset.ministerio));
    });
    listaEl.querySelectorAll('[data-acao="editar"]').forEach(btn => {
      btn.addEventListener('click', () => abrirFormularioEditarUsuario(btn.dataset.profileId));
    });
    listaEl.querySelectorAll('[data-acao="admin"]').forEach(btn => {
      btn.addEventListener('click', () => alternarAdmin(btn.dataset.profileId, btn.dataset.ehAdmin === 'true'));
    });
    listaEl.querySelectorAll('[data-acao="apagar"]').forEach(btn => {
      btn.addEventListener('click', () => apagarUsuario(btn.dataset.profileId));
    });
    listaEl.querySelectorAll('[data-acao="adicionar-membro"]').forEach(btn => {
      btn.addEventListener('click', () => adicionarAoMinisterio(btn.dataset.profileId, 'membro'));
    });
    listaEl.querySelectorAll('[data-acao="adicionar-lider"]').forEach(btn => {
      btn.addEventListener('click', () => adicionarAoMinisterio(btn.dataset.profileId, 'lider'));
    });
  }

  async function alternarAdmin(profileId, ehAdminAtual) {
    const pessoa = todosUsuarios.find(p => p.id === profileId);
    const nome = pessoa?.nome || 'essa pessoa';
    const novoPapel = ehAdminAtual ? 'membro' : 'admin';
    const mensagem = ehAdminAtual
      ? `Remover ${nome} do cargo de Admin?`
      : `Tornar ${nome} Admin? Isso dá acesso total ao sistema (financeiro, usuários, tudo).`;
    if (!confirm(mensagem)) return;

    const { error } = await supa.from('profiles').update({ papel: novoPapel }).eq('id', profileId);
    if (error) { alert(`Erro: ${error.message}`); return; }
    if (pessoa) pessoa.papel = novoPapel;
    renderizarListaUsuarios();
  }

  const _CAMPOS_EDITAR_USUARIO = [
    ['nome', 'Nome completo', 'text'],
    ['telefone', 'Telefone (WhatsApp)', 'text'],
    ['endereco', 'Endereço', 'text'],
    ['data_nascimento', 'Data de nascimento', 'date'],
  ];
  const _OPCOES_ESTADO_CIVIL = [
    ['solteiro', 'Solteiro(a)'], ['namorando', 'Namorando'], ['noivo', 'Noivo(a)'],
    ['casado', 'Casado(a)'], ['outro', 'Outro'],
  ];
  const _OPCOES_SEXO = [['masculino', 'Masculino'], ['feminino', 'Feminino']];

  function abrirFormularioEditarUsuario(profileId) {
    const pessoa = todosUsuarios.find(p => p.id === profileId);
    if (!pessoa) return;

    document.getElementById('caixa-modal').innerHTML = `
      <button class="fechar-modal" id="fechar-modal">✕</button>
      <h2>Editar perfil</h2>
      <div class="campo-form">
        <label>E-mail (login -- não editável aqui)</label>
        <input type="text" value="${escaparAtributo(pessoa.email || 'não encontrado')}" disabled>
      </div>
      ${_CAMPOS_EDITAR_USUARIO.map(([campo, label, tipo]) => `
        <div class="campo-form">
          <label>${label}</label>
          <input type="${tipo}" id="edit-${campo}" value="${escaparAtributo(pessoa[campo] || '')}">
        </div>
      `).join('')}
      <div class="campo-form">
        <label>Estado civil</label>
        <select id="edit-estado_civil">
          <option value="">Não informado</option>
          ${_OPCOES_ESTADO_CIVIL.map(([v, l]) => `<option value="${v}" ${pessoa.estado_civil === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="campo-form">
        <label>Sexo</label>
        <select id="edit-sexo">
          <option value="">Não informado</option>
          ${_OPCOES_SEXO.map(([v, l]) => `<option value="${v}" ${pessoa.sexo === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="campo-form">
        <label>Grupo de casais</label>
        <select id="edit-grupo_casais">
          <option value="">Nenhum</option>
          ${Object.entries(LABEL_GRUPO_CASAIS).map(([v, l]) => `<option value="${v}" ${pessoa.grupo_casais === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <p class="erro-form" id="erro-editar-usuario"></p>
      <div class="acoes-modal">
        <button class="botao-secundario" id="cancelar-editar-usuario">Cancelar</button>
        <button class="botao-primario" style="flex:1;" id="salvar-editar-usuario">Salvar</button>
      </div>
    `;
    document.getElementById('fundo-modal').classList.add('aberto');
    document.getElementById('fechar-modal').addEventListener('click', fecharModal);
    document.getElementById('cancelar-editar-usuario').addEventListener('click', fecharModal);
    document.getElementById('salvar-editar-usuario').addEventListener('click', async () => {
      const campos = {
        nome: document.getElementById('edit-nome').value.trim(),
        telefone: document.getElementById('edit-telefone').value.trim() || null,
        endereco: document.getElementById('edit-endereco').value.trim() || null,
        data_nascimento: document.getElementById('edit-data_nascimento').value || null,
        estado_civil: document.getElementById('edit-estado_civil').value || null,
        sexo: document.getElementById('edit-sexo').value || null,
        grupo_casais: document.getElementById('edit-grupo_casais').value || null,
      };
      if (!campos.nome) {
        document.getElementById('erro-editar-usuario').textContent = 'Informe o nome.';
        return;
      }
      const { error } = await supa.from('profiles').update(campos).eq('id', profileId);
      if (error) {
        document.getElementById('erro-editar-usuario').textContent = `Erro: ${error.message}`;
        return;
      }
      Object.assign(pessoa, campos);
      fecharModal();
      renderizarListaUsuarios();
    });
  }

  async function apagarUsuario(profileId) {
    const pessoa = todosUsuarios.find(p => p.id === profileId);
    const nome = pessoa?.nome || 'essa pessoa';
    const digitado = prompt(
      `Isso apaga a conta de "${nome}" e TODOS os dados dela pra sempre (dízimos, escalas, filhos...). `
      + `Não pode ser desfeito.\n\nDigite APAGAR pra confirmar:`,
    );
    if (digitado?.trim().toUpperCase() !== 'APAGAR') return;

    const { data: sessao } = await supa.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-apagar-usuario`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${sessao.session.access_token}`,
      },
      body: JSON.stringify({ profileId }),
    });
    const resultado = await resp.json();
    if (!resp.ok) {
      alert(`Erro ao apagar: ${resultado.error || 'desconhecido'}`);
      return;
    }
    todosUsuarios = todosUsuarios.filter(p => p.id !== profileId);
    todosVinculosMinisterio = todosVinculosMinisterio.filter(v => v.profile_id !== profileId);
    renderizarVisaoGeral();
    renderizarAgregados();
    renderizarListaUsuarios();
  }

  // Clicar num chip de ministerio alterna papel membro<->lider daquele
  // vinculo especifico -- nunca cria/apaga vinculo, so alterna o papel
  // de um que ja existe.
  async function alternarLiderMinisterio(chip) {
    const profileId = chip.dataset.profileId;
    const ministerio = chip.dataset.ministerio;
    const novoPapel = chip.dataset.papelAtual === 'lider' ? 'membro' : 'lider';
    const nomePessoa = todosUsuarios.find(p => p.id === profileId)?.nome || 'essa pessoa';
    const labelMinisterio = LABEL_MINISTERIO_AGREGADO[ministerio] || ministerio;

    const mensagem = novoPapel === 'lider'
      ? `Tornar ${nomePessoa} líder de ${labelMinisterio}?`
      : `Remover ${nomePessoa} da liderança de ${labelMinisterio}?`;
    if (!confirm(mensagem)) return;

    const { error } = await supa
      .from('profile_ministerios')
      .update({ papel: novoPapel })
      .eq('profile_id', profileId)
      .eq('ministerio', ministerio);

    if (error) { alert('Erro ao atualizar: ' + error.message); return; }

    const vinculo = todosVinculosMinisterio.find(v => v.profile_id === profileId && v.ministerio === ministerio);
    if (vinculo) vinculo.papel = novoPapel;

    renderizarAgregados();
    renderizarListaUsuarios();
  }

  // Adiciona a pessoa a um ministério que ela AINDA NAO tem vinculo --
  // usado tanto pra "alguem entrou pro Coral" (papel='membro') quanto
  // pra ja entrar direto como lider (papel='lider'), sem precisar do
  // passo intermediario de virar membro e so depois clicar no chip.
  async function adicionarAoMinisterio(profileId, papel) {
    const selectEl = document.getElementById(`select-ministerio-${profileId}`);
    const ministerio = selectEl?.value;
    if (!ministerio) {
      alert('Escolha um ministério na lista antes.');
      return;
    }

    const nomePessoa = todosUsuarios.find(p => p.id === profileId)?.nome || 'essa pessoa';
    const labelMinisterio = LABEL_MINISTERIO_AGREGADO[ministerio] || ministerio;
    const mensagem = papel === 'lider'
      ? `Adicionar ${nomePessoa} a ${labelMinisterio} já como líder?`
      : `Adicionar ${nomePessoa} a ${labelMinisterio}?`;
    if (!confirm(mensagem)) return;

    const { error } = await supa
      .from('profile_ministerios')
      .upsert({ profile_id: profileId, ministerio, papel }, { onConflict: 'profile_id,ministerio' });
    if (error) { alert('Erro ao adicionar: ' + error.message); return; }

    todosVinculosMinisterio.push({ profile_id: profileId, ministerio, papel });
    renderizarAgregados();
    renderizarListaUsuarios();
  }

  // Tira a pessoa de um ministério por completo (apaga o vínculo, nao
  // so tira a lideranca) -- ex: alguem saiu do Coral.
  async function removerDoMinisterio(profileId, ministerio) {
    const nomePessoa = todosUsuarios.find(p => p.id === profileId)?.nome || 'essa pessoa';
    const labelMinisterio = LABEL_MINISTERIO_AGREGADO[ministerio] || ministerio;
    if (!confirm(`Tirar ${nomePessoa} de ${labelMinisterio}?`)) return;

    const { error } = await supa
      .from('profile_ministerios')
      .delete()
      .eq('profile_id', profileId)
      .eq('ministerio', ministerio);
    if (error) { alert('Erro ao remover: ' + error.message); return; }

    todosVinculosMinisterio = todosVinculosMinisterio.filter(
      v => !(v.profile_id === profileId && v.ministerio === ministerio),
    );
    renderizarAgregados();
    renderizarListaUsuarios();
  }

  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  verificarSessao();
</script>

</body>
