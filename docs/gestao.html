<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shallom — Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0C192E;
    --azul: #9BB0C7;
    --azul-claro: #EEF2F6;
    --creme: #F7F2DD;
    --cinza-texto: #45566E;
    --branco: #FFFFFF;
    --vermelho: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--branco);
    color: var(--navy);
    min-height: 100vh;
  }

  /* ---------- tela de login ---------- */
  .tela-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cartao-login {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .cartao-login h1 {
    font-style: italic;
    font-weight: 800;
    font-size: 30px;
    margin: 0 0 4px;
  }
  .cartao-login .subtitulo {
    color: var(--cinza-texto);
    font-size: 14px;
    margin: 0 0 32px;
  }
  .campo { text-align: left; margin-bottom: 16px; }
  .campo label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #D7DEE6;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .campo input:focus {
    outline: none;
    border-color: var(--navy);
  }
  .botao-primario {
    width: 100%;
    padding: 12px;
    background: var(--navy);
    color: var(--branco);
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  .botao-primario:disabled { opacity: 0.6; cursor: default; }
  .erro-login {
    color: var(--vermelho);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }

  /* ---------- shell logado ---------- */
  .app { display: none; min-height: 100vh; }
  header.topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid #E5EAEF;
  }
  header.topo .marca {
    font-style: italic;
    font-weight: 800;
    font-size: 18px;
  }
  header.topo .usuario {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--cinza-texto);
  }
  header.topo button.sair {
    background: none;
    border: 1px solid #D7DEE6;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    color: var(--navy);
  }

  main.conteudo { padding: 32px 24px; max-width: 1100px; margin: 0 auto; }

  .em-construcao {
    background: var(--azul-claro);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: var(--cinza-texto);
  }
  .em-construcao h2 { color: var(--navy); margin-top: 0; }

  .tela-negada {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  /* ---------- calendario admin ---------- */
  .calendario-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
    align-items: start;
  }
  .cabecalho-mes {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cabecalho-mes h2 { margin: 0; font-size: 20px; text-transform: capitalize; }
  .cabecalho-mes .navegacao button {
    background: none;
    border: 1px solid #D7DEE6;
    border-radius: 6px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 15px;
    color: var(--navy);
  }
  .cabecalho-mes .navegacao button:hover { background: var(--azul-claro); }

  .grade-calendario {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .dia-semana-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--cinza-texto);
    padding-bottom: 6px;
    text-transform: uppercase;
  }
  .dia-celula {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 6px 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .dia-celula:hover { background: var(--azul-claro); }
  .dia-celula.fora-do-mes { color: #C3CCD6; }
  .dia-celula.hoje { border-color: var(--navy); font-weight: 700; }
  .dia-celula.selecionado { background: var(--navy); color: var(--branco); }
  .dia-celula .pontos { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .dia-celula .ponto { width: 5px; height: 5px; border-radius: 50%; }

  .painel-lateral {
    background: var(--azul-claro);
    border-radius: 12px;
    padding: 16px;
    max-height: 640px;
    overflow-y: auto;
  }
  .painel-lateral h3 { margin: 0 0 12px; font-size: 15px; }
  .item-evento {
    background: var(--branco);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid #E5EAEF;
  }
  .item-evento:hover { border-color: var(--navy); }
  .item-evento .cor-tag {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .item-evento .titulo-evento { font-weight: 700; font-size: 14px; }
  .item-evento .meta-evento { font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }

  .vazio-lateral { color: var(--cinza-texto); font-size: 13px; text-align: center; padding: 24px 0; }

  /* ---------- modal de detalhe ---------- */
  .fundo-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(12,25,46,0.4);
    align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .fundo-modal.aberto { display: flex; }
  .caixa-modal {
    background: var(--branco);
    border-radius: 14px;
    padding: 28px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .caixa-modal .fechar-modal {
    float: right;
    background: none; border: none;
    font-size: 18px; cursor: pointer;
    color: var(--cinza-texto);
  }
  .caixa-modal h2 { margin: 4px 0 4px; font-size: 19px; }
  .caixa-modal .categoria-modal { font-size: 12px; color: var(--cinza-texto); margin-bottom: 12px; }
  .caixa-modal .linha-info {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: 8px; color: var(--navy);
  }
  .caixa-modal .descricao-modal { font-size: 13px; margin-top: 12px; line-height: 1.6; color: var(--cinza-texto); }
  .caixa-modal img { width: 100%; border-radius: 10px; margin-top: 12px; }
  .caixa-modal .acoes-modal { display: flex; gap: 10px; margin-top: 20px; }
  .botao-secundario {
    flex: 1;
    padding: 10px;
    background: var(--branco);
    border: 1px solid #D7DEE6;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: var(--navy);
  }
  .botao-perigo { color: var(--vermelho); border-color: #F0C6C0; }

  .campo-form { text-align: left; margin-bottom: 14px; }
  .campo-form label {
    display: block; font-size: 12px; font-weight: 700;
    margin-bottom: 5px; color: var(--navy);
  }
  .campo-form input, .campo-form select, .campo-form textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #D7DEE6;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
  }
  .campo-form textarea { resize: vertical; min-height: 60px; }
  .linha-form { display: flex; gap: 10px; }
  .linha-form .campo-form { flex: 1; }
  .campo-form.check { display: flex; align-items: center; gap: 8px; }
  .campo-form.check label { margin: 0; }
  .erro-form { color: var(--vermelho); font-size: 12px; margin-top: 4px; min-height: 14px; }
  .grupo-checkbox { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .grupo-checkbox label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--navy);
    background: var(--azul-claro); padding: 6px 10px; border-radius: 20px;
    cursor: pointer;
  }
  .radio-simples { display: flex; gap: 16px; margin-top: 4px; }
  .radio-simples label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }

  /* ---------- financeiro ---------- */
  .item-pessoa {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .item-pessoa:hover { background: var(--azul-claro); }
  .item-pessoa.selecionada { background: var(--navy); color: var(--branco); }

  .cartao-lancamento {
    background: var(--azul-claro);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .cartao-lancamento h3 { margin-top: 0; font-size: 15px; }

  .item-historico {
    background: var(--branco);
    border: 1px solid #E5EAEF;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item-historico .valor-historico { font-weight: 700; }
  .item-historico .meta-historico { font-size: 12px; color: var(--cinza-texto); }
  .item-historico .excluir-lancamento {
    background: none; border: none; color: var(--vermelho);
    cursor: pointer; font-size: 12px;
  }

  .item-pendente {
    background: var(--branco);
    border: 1px solid #F0C6C0;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .item-pendente .topo-pendente { display: flex; justify-content: space-between; font-size: 13px; }
  .item-pendente .valor-pendente { font-weight: 700; }
  .item-pendente select { margin-top: 8px; width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #D7DEE6; font-family: inherit; font-size: 12px; }
  .item-pendente button { margin-top: 8px; width: 100%; }
</style>
</head>
<body>

  <!-- ===== Tela de login ===== -->
  <div class="tela-login" id="tela-login">
    <div class="cartao-login">
      <h1>shallom</h1>
      <p class="subtitulo">Painel de gestão</p>
      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="botao-primario" id="botao-entrar">Entrar</button>
        <p class="erro-login" id="erro-login"></p>
      </form>
    </div>
  </div>

  <!-- ===== Acesso negado (logado, mas nao e admin/financeiro) ===== -->
  <div class="tela-negada" id="tela-negada" style="display:none;">
    <div>
      <h2>Esse painel é restrito à administração.</h2>
      <p style="color:var(--cinza-texto)">Sua conta não tem esse tipo de acesso.</p>
      <button class="botao-primario" style="width:auto;padding:10px 20px;" id="botao-sair-negado">Sair</button>
    </div>
  </div>

  <!-- ===== App logado ===== -->
  <div class="app" id="app">
    <header class="topo">
      <div class="marca">shallom — gestão</div>
      <div class="usuario">
        <span id="nome-usuario"></span>
        <button class="sair" id="botao-sair">Sair</button>
      </div>
    </header>
    <main class="conteudo" id="conteudo">
      <!-- preenchido via JS conforme o papel (admin / admin_financeiro) -->
    </main>
  </div>

<script>
  const SUPABASE_URL = "https://eetethnvupitlquhdjkx.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldGV0aG52dXBpdGxxdWhkamt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDI4MjksImV4cCI6MjEwMTExODgyOX0.QL1dNFxoRuHJwf_pwAzFou34oA0cSAkUguND0l9b4z8";
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const telaLogin = document.getElementById('tela-login');
  const telaNegada = document.getElementById('tela-negada');
  const appEl = document.getElementById('app');
  const conteudoEl = document.getElementById('conteudo');
  const nomeUsuarioEl = document.getElementById('nome-usuario');

  function mostrarSomente(el) {
    [telaLogin, telaNegada, appEl].forEach(e => e.style.display = 'none');
    el.style.display = el === appEl ? 'block' : 'flex';
  }

  async function verificarSessao() {
    const { data: { session } } = await supa.auth.getSession();
    if (!session) { mostrarSomente(telaLogin); return; }
    await carregarPainel(session);
  }

  async function carregarPainel(session) {
    const { data: perfil, error } = await supa
      .from('profiles')
      .select('nome, papel')
      .eq('id', session.user.id)
      .single();

    if (error || !perfil || (perfil.papel !== 'admin' && perfil.papel !== 'admin_financeiro')) {
      mostrarSomente(telaNegada);
      return;
    }

    nomeUsuarioEl.textContent = `${perfil.nome} — ${perfil.papel === 'admin' ? 'Admin' : 'Admin Financeiro'}`;
    renderizarConteudo(perfil.papel);
    mostrarSomente(appEl);
  }

  function renderizarConteudo(papel) {
    if (papel === 'admin') {
      conteudoEl.innerHTML = `
        <div class="cabecalho-mes">
          <h2 id="titulo-mes"></h2>
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="navegacao">
              <button id="mes-anterior">‹</button>
              <button id="mes-proximo">›</button>
            </div>
            <button class="botao-primario" style="width:auto;padding:8px 16px;" id="botao-novo-evento">+ Novo evento</button>
          </div>
        </div>
        <div class="calendario-layout">
          <div>
            <div class="grade-calendario" id="dias-semana-labels"></div>
            <div class="grade-calendario" id="grade-dias" style="margin-top:4px;"></div>
          </div>
          <div class="painel-lateral">
            <h3 id="titulo-painel-lateral">Próximos eventos</h3>
            <div id="lista-lateral"></div>
          </div>
        </div>`;
      iniciarCalendarioAdmin();
    } else {
      conteudoEl.innerHTML = `
        <div class="calendario-layout" style="grid-template-columns: 320px 1fr;">
          <div>
            <div class="campo-form">
              <label>Buscar pessoa</label>
              <input type="text" id="busca-pessoa" placeholder="Nome...">
            </div>
            <div id="lista-pessoas" style="max-height:560px; overflow-y:auto;"></div>
          </div>
          <div>
            <div id="painel-financeiro-direita">
              <div class="vazio-lateral" style="padding:40px 0;">Selecione uma pessoa à esquerda.</div>
            </div>
            <div style="margin-top:24px;">
              <h3>Transações do PagBank sem vínculo</h3>
              <div id="lista-pendentes"></div>
            </div>
          </div>
        </div>`;
      iniciarPainelFinanceiro();
    }
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const botao = document.getElementById('botao-entrar');
    const erroEl = document.getElementById('erro-login');

    erroEl.textContent = '';
    botao.disabled = true;
    botao.textContent = 'Entrando...';

    const { data, error } = await supa.auth.signInWithPassword({ email, password: senha });

    botao.disabled = false;
    botao.textContent = 'Entrar';

    if (error) {
      erroEl.textContent = 'E-mail ou senha incorretos.';
      return;
    }

    await carregarPainel(data.session);
  });

  async function sair() {
    await supa.auth.signOut();
    mostrarSomente(telaLogin);
  }
  document.getElementById('botao-sair').addEventListener('click', sair);
  document.getElementById('botao-sair-negado').addEventListener('click', sair);

  // =========================================================
  // Calendario admin
  // =========================================================
  const CORES_ESCOPO = {
    igreja: '#60A5FA', lideranca: '#FB923C', casais: '#EF4444',
    homens: '#1D4ED8', mulheres: '#EC4899', embaixadores_mensageiras: '#8D6E63',
    criancas: '#C4B5FD', coral: '#000000', danca: '#000000', diaconos: '#000000',
    louvor: '#000000', midia: '#000000', multimidia: '#000000', teatro: '#000000',
  };
  const CORES_TIPO_AWAKE = { gc: '#4ADE80', comunhao: '#FACC15', laje: '#A78BFA' };
  const LABEL_ESCOPO = {
    igreja: 'Igreja (todos)', lideranca: 'Liderança geral', casais: 'Casais',
    homens: 'Homens', mulheres: 'Mulheres', awake: 'Awake',
    embaixadores_mensageiras: 'Embaixadores e Mensageiras', criancas: 'Crianças',
    coral: 'Coral', danca: 'Dança', diaconos: 'Diáconos', louvor: 'Louvor',
    midia: 'Mídia', multimidia: 'Multimídia', teatro: 'Teatro',
  };
  const ORDEM_ESCOPOS = Object.keys(LABEL_ESCOPO);
  const TIPOS_POR_ESCOPO = {
    igreja: { ebd: 'EBD', culto_celebracao: 'Culto de Celebração', culto_familia: 'Culto da Família', outro: 'Outro' },
    awake: { gc: 'GC', comunhao: 'Comunhão', laje: 'Laje', outro: 'Outro' },
  };

  function corDoEvento(ev) {
    if (ev.escopo === 'awake') return CORES_TIPO_AWAKE[ev.tipo] || '#A78BFA';
    return CORES_ESCOPO[ev.escopo] || '#60A5FA';
  }

  function ocorrenciasNoIntervalo(evento, inicio, fim) {
    const ocorrencias = [];
    const dataBase = new Date(evento.data_inicio);
    if (!evento.recorrente) {
      if (dataBase >= inicio && dataBase <= fim) ocorrencias.push(dataBase);
      return ocorrencias;
    }
    const fimRecorrencia = evento.recorrencia_fim ? new Date(evento.recorrencia_fim + 'T23:59:59') : null;
    let cursor = new Date(dataBase);
    while (cursor < inicio) cursor.setDate(cursor.getDate() + 7);
    while (cursor <= fim) {
      if (!fimRecorrencia || cursor <= fimRecorrencia) {
        const semanasDoMes = evento.semanas_do_mes;
        if (!semanasDoMes || semanasDoMes.length === 0) {
          ocorrencias.push(new Date(cursor));
        } else {
          const semana = Math.floor((cursor.getDate() - 1) / 7) + 1;
          if (semanasDoMes.includes(semana)) ocorrencias.push(new Date(cursor));
        }
      }
      cursor.setDate(cursor.getDate() + 7);
    }
    return ocorrencias;
  }

  let mesAtual = new Date();
  mesAtual.setDate(1);
  let diaSelecionado = null;
  let todosEventos = [];

  async function iniciarCalendarioAdmin() {
    const labelsEl = document.getElementById('dias-semana-labels');
    labelsEl.innerHTML = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb']
      .map(d => `<div class="dia-semana-label">${d}</div>`).join('');

    document.getElementById('mes-anterior').addEventListener('click', () => {
      mesAtual.setMonth(mesAtual.getMonth() - 1);
      diaSelecionado = null;
      renderizarMes();
    });
    document.getElementById('mes-proximo').addEventListener('click', () => {
      mesAtual.setMonth(mesAtual.getMonth() + 1);
      diaSelecionado = null;
      renderizarMes();
    });

    const { data, error } = await supa.from('eventos').select('*');
    todosEventos = data || [];
    renderizarMes();
  }

  function renderizarMes() {
    const tituloEl = document.getElementById('titulo-mes');
    tituloEl.textContent = mesAtual.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

    const primeiroDiaMes = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1);
    const inicioGrade = new Date(primeiroDiaMes);
    inicioGrade.setDate(inicioGrade.getDate() - inicioGrade.getDay());
    const fimGrade = new Date(inicioGrade);
    fimGrade.setDate(fimGrade.getDate() + 41); // 6 semanas

    // Mapa dia -> lista de {evento, data}
    const porDia = {};
    todosEventos.forEach(ev => {
      ocorrenciasNoIntervalo(ev, inicioGrade, fimGrade).forEach(data => {
        const chave = data.toDateString();
        (porDia[chave] = porDia[chave] || []).push({ evento: ev, data });
      });
    });

    const hoje = new Date();
    const gradeEl = document.getElementById('grade-dias');
    let html = '';
    for (let i = 0; i < 42; i++) {
      const dia = new Date(inicioGrade);
      dia.setDate(dia.getDate() + i);
      const chave = dia.toDateString();
      const foraDoMes = dia.getMonth() !== mesAtual.getMonth();
      const ehHoje = dia.toDateString() === hoje.toDateString();
      const ehSelecionado = diaSelecionado && dia.toDateString() === diaSelecionado.toDateString();
      const itensDoDia = porDia[chave] || [];

      const pontos = itensDoDia.slice(0, 4)
        .map(item => `<span class="ponto" style="background:${corDoEvento(item.evento)}"></span>`)
        .join('');

      html += `
        <div class="dia-celula ${foraDoMes ? 'fora-do-mes' : ''} ${ehHoje ? 'hoje' : ''} ${ehSelecionado ? 'selecionado' : ''}"
             data-dia="${dia.toISOString()}">
          ${dia.getDate()}
          <div class="pontos">${pontos}</div>
        </div>`;
    }
    gradeEl.innerHTML = html;

    gradeEl.querySelectorAll('.dia-celula').forEach(el => {
      el.addEventListener('click', () => {
        diaSelecionado = new Date(el.dataset.dia);
        renderizarMes();
      });
    });

    renderizarListaLateral(porDia, inicioGrade);
  }

  function renderizarListaLateral(porDia, inicioGrade) {
    const tituloEl = document.getElementById('titulo-painel-lateral');
    const listaEl = document.getElementById('lista-lateral');

    let itens;
    if (diaSelecionado) {
      tituloEl.textContent = diaSelecionado.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
      itens = porDia[diaSelecionado.toDateString()] || [];
    } else {
      tituloEl.textContent = 'Próximos eventos';
      const hoje = new Date();
      const daquiA30 = new Date(hoje.getTime() + 30 * 24 * 60 * 60 * 1000);
      itens = [];
      todosEventos.forEach(ev => {
        ocorrenciasNoIntervalo(ev, hoje, daquiA30).forEach(data => itens.push({ evento: ev, data }));
      });
      itens.sort((a, b) => a.data - b.data);
      itens = itens.slice(0, 15);
    }

    if (itens.length === 0) {
      listaEl.innerHTML = '<div class="vazio-lateral">Nenhum evento aqui.</div>';
      return;
    }

    listaEl.innerHTML = itens.map(item => `
      <div class="item-evento" data-evento-id="${item.evento.id}" data-data="${item.data.toISOString()}">
        <div class="titulo-evento"><span class="cor-tag" style="background:${corDoEvento(item.evento)}"></span>${escaparHtml(item.evento.titulo)}</div>
        <div class="meta-evento">${item.data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} às ${item.data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
      </div>
    `).join('');

    listaEl.querySelectorAll('.item-evento').forEach(el => {
      el.addEventListener('click', () => abrirDetalheEvento(el.dataset.eventoId, new Date(el.dataset.data)));
    });
  }

  function abrirDetalheEvento(eventoId, data) {
    const evento = todosEventos.find(e => e.id === eventoId);
    if (!evento) return;

    const categoria = evento.escopo === 'awake' && evento.tipo && CORES_TIPO_AWAKE[evento.tipo]
      ? `Awake • ${evento.tipo}`
      : (LABEL_ESCOPO[evento.escopo] || evento.escopo);

    document.getElementById('caixa-modal').innerHTML = `
      <button class="fechar-modal" id="fechar-modal">✕</button>
      <div class="categoria-modal">
        <span class="cor-tag" style="background:${corDoEvento(evento)}"></span>${escaparHtml(categoria)}
      </div>
      <h2>${escaparHtml(evento.titulo)}</h2>
      <div class="linha-info">🕒 ${data.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })} às ${data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
      ${evento.local ? `<div class="linha-info">📍 ${escaparHtml(evento.local)}</div>` : ''}
      ${evento.recorrente ? `<div class="linha-info">🔁 Evento recorrente</div>` : ''}
      ${evento.descricao ? `<div class="descricao-modal">${escaparHtml(evento.descricao)}</div>` : ''}
      ${evento.foto_url ? `<img src="${evento.foto_url}">` : ''}
      <div class="acoes-modal">
        <button class="botao-secundario" id="btn-editar-evento">Editar</button>
        <button class="botao-secundario botao-perigo" id="btn-excluir-evento">Excluir</button>
      </div>
    `;
    document.getElementById('fundo-modal').classList.add('aberto');
    document.getElementById('fechar-modal').addEventListener('click', fecharModal);
    document.getElementById('btn-editar-evento').addEventListener('click', () => abrirFormularioEvento(evento));
    document.getElementById('btn-excluir-evento').addEventListener('click', () => excluirEvento(evento));
  }

    document.getElementById('fundo-modal').classList.remove('aberto');
  }
  document.getElementById('fundo-modal').addEventListener('click', (e) => {
    if (e.target.id === 'fundo-modal') fecharModal();

  async function salvarEvento(eventoExistente) {
    const titulo = document.getElementById('f-titulo').value.trim();
    const erroEl = document.getElementById('erro-form');
    if (!titulo) { erroEl.textContent = 'Informe um título.'; return; }

    const escopo = document.getElementById('f-escopo').value;
    const tipoSel = document.getElementById('f-tipo');
    const tipo = (tipoSel && tipoSel.options.length) ? tipoSel.value : 'outro';
    const dataInicio = document.getElementById('f-data').value;
    if (!dataInicio) { erroEl.textContent = 'Selecione a data e hora.'; return; }
    const recorrente = document.getElementById('f-recorrente').checked;
    const recorrenciaFim = document.getElementById('f-recorrencia-fim').value || null;

    const awakeModo = document.querySelector('input[name="f-awake-modo"]:checked')?.value;
    const publicoAlvo = (escopo === 'awake' && awakeModo === 'grupos')
      ? Array.from(document.querySelectorAll('.chk-subgrupo:checked')).map(el => el.value)
      : null;

    const generoModo = document.querySelector('input[name="f-genero-modo"]:checked')?.value;
    const publicoGenero = ((escopo === 'awake' || escopo === 'coral') && generoModo === 'um')
      ? Array.from(document.querySelectorAll('.chk-genero:checked')).map(el => el.value)
      : null;

    const casaisModo = document.querySelector('input[name="f-casais-modo"]:checked')?.value;
    const publicoCasais = (escopo === 'casais' && casaisModo === 'grupos')
      ? Array.from(document.querySelectorAll('.chk-casal:checked')).map(el => el.value)
      : null;

    const payload = {
      titulo,
      escopo,
      tipo,
      data_inicio: new Date(dataInicio).toISOString(),
      local: document.getElementById('f-local').value.trim() || null,
      descricao: document.getElementById('f-descricao').value.trim() || null,
      recorrente,
      recorrencia_fim: recorrente ? recorrenciaFim : null,
      publico_alvo: (publicoAlvo && publicoAlvo.length) ? publicoAlvo : null,
      publico_genero: (publicoGenero && publicoGenero.length) ? publicoGenero : null,
      publico_casais: (publicoCasais && publicoCasais.length) ? publicoCasais : null,
    };

    const botao = document.getElementById('btn-salvar-form');
    botao.disabled = true;
    botao.textContent = 'Salvando...';

    let resultado;
    if (eventoExistente) {
      resultado = await supa.from('eventos').update(payload).eq('id', eventoExistente.id);
    } else {
      resultado = await supa.from('eventos').insert(payload);
    }

    if (resultado.error) {
      erroEl.textContent = 'Erro ao salvar: ' + resultado.error.message;
      botao.disabled = false;
      botao.textContent = 'Salvar';
      return;
    }

    fecharModal();
    await recarregarEventos();
  }

  async function excluirEvento(evento) {
    if (!confirm(`Excluir "${evento.titulo}" permanentemente? Essa ação não pode ser desfeita.`)) return;
    const { error } = await supa.from('eventos').delete().eq('id', evento.id);
    if (error) { alert('Erro ao excluir: ' + error.message); return; }
    fecharModal();
    await recarregarEventos();
  }

  async function recarregarEventos() {
    const { data } = await supa.from('eventos').select('*');
    todosEventos = data || [];
    renderizarMes();
  }

  function escaparAtributo(texto) {
    return escaparHtml(texto).replace(/"/g, '&quot;');
  }

  // =========================================================
  // Painel financeiro
  // =========================================================
  let todasPessoas = [];
  let pessoaSelecionada = null;

  async function iniciarPainelFinanceiro() {
    const { data: pessoas } = await supa.from('profiles').select('id, nome').order('nome');
    todasPessoas = pessoas || [];
    renderizarListaPessoas();

    document.getElementById('busca-pessoa').addEventListener('input', renderizarListaPessoas);
    await carregarPendentes();
  }

  function renderizarListaPessoas() {
    const busca = document.getElementById('busca-pessoa').value.trim().toLowerCase();
    const filtradas = busca
      ? todasPessoas.filter(p => (p.nome || '').toLowerCase().includes(busca))
      : todasPessoas;

    document.getElementById('lista-pessoas').innerHTML = filtradas.map(p => `
      <div class="item-pessoa ${pessoaSelecionada?.id === p.id ? 'selecionada' : ''}" data-id="${p.id}">
        ${escaparHtml(p.nome || '(sem nome)')}
      </div>
    `).join('');

    document.querySelectorAll('.item-pessoa').forEach(el => {
      el.addEventListener('click', () => {
        pessoaSelecionada = todasPessoas.find(p => p.id === el.dataset.id);
        renderizarListaPessoas();
        renderizarPainelPessoa();
      });
    });
  }

    const el = document.getElementById('painel-financeiro-direita');

    el.innerHTML = `
      <h2 style="margin-top:0;">${escaparHtml(pessoaSelecionada.nome)}</h2>

        <div class="linha-form">
          <div class="campo-form">

            <input type="text" id="lc-valor" placeholder="0,00">
          </div>
          <div class="campo-form">
            <label>Data</label>
            <input type="date" id="lc-data" value="${new Date().toISOString().split('T')[0]}">
          </div>
        </div>
        <div class="campo-form">
          <label>Meio de pagamento</label>
          <select id="lc-meio">
            <option value="pix">Pix</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
            <option value="transferencia">Transferência</option>
            <option value="boleto">Boleto</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="campo-form">
          <label>Observação (opcional)</label>
          <input type="text" id="lc-observacao">

    document.getElementById('btn-lancar').addEventListener('click', lancarContribuicao);

  }

  async function carregarHistorico() {
    const { data } = await supa
      .from('contribuicoes')
      .select('*')
      .eq('profile_id', pessoaSelecionada.id)
      .order('data', { ascending: false });

    const historicoEl = document.getElementById('lista-historico');
    if (!data || data.length === 0) {
      historicoEl.innerHTML = '<div class="vazio-lateral">Nenhum lançamento ainda.</div>';
      return;
    }

    const LABEL_MEIO = { pix: 'Pix', dinheiro: 'Dinheiro', cartao: 'Cartão', transferencia: 'Transferência', boleto: 'Boleto', outro: 'Outro' };
    historicoEl.innerHTML = data.map(c => `
      <div class="item-historico">
        <div>
          <div class="valor-historico">R$ ${Number(c.valor).toFixed(2)}</div>
          <div class="meta-historico">${new Date(c.data).toLocaleDateString('pt-BR')} • ${LABEL_MEIO[c.meio_pagamento] || c.meio_pagamento}${c.observacao ? ' • ' + escaparHtml(c.observacao) : ''}</div>
        </div>
        <button class="excluir-lancamento" data-id="${c.id}">Excluir</button>
      </div>
    `).join('');

    document.querySelectorAll('.excluir-lancamento').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir esse lançamento?')) return;
        await supa.from('contribuicoes').delete().eq('id', btn.dataset.id);
        await carregarHistorico();
      });
    });
  }

  async function lancarContribuicao() {
    const valorTexto = document.getElementById('lc-valor').value.replace(',', '.');
    const valor = parseFloat(valorTexto);
    const erroEl = document.getElementById('erro-lancamento');
    if (!valor || valor <= 0) { erroEl.textContent = 'Informe um valor válido.'; return; }

    const { error } = await supa.from('contribuicoes').insert({
      profile_id: pessoaSelecionada.id,
      data: document.getElementById('lc-data').value,
      valor,
      meio_pagamento: document.getElementById('lc-meio').value,
      observacao: document.getElementById('lc-observacao').value.trim() || null,
    });

    if (error) { erroEl.textContent = 'Erro: ' + error.message; return; }

    document.getElementById('lc-valor').value = '';
    document.getElementById('lc-observacao').value = '';
    await carregarHistorico();
  }

  async function carregarPendentes() {
    const { data } = await supa
      .from('transacoes_bancarias')
      .select('*')
      .is('profile_id', null)
      .order('data_transacao', { ascending: false });

    const listaEl = document.getElementById('lista-pendentes');
    if (!data || data.length === 0) {
      listaEl.innerHTML = '<div class="vazio-lateral">Nenhuma transação pendente. 🎉</div>';
      return;
    }

    listaEl.innerHTML = data.map(t => `
      <div class="item-pendente" data-id="${t.id}" data-valor="${t.valor}">
        <div class="topo-pendente">
          <span>${escaparHtml(t.nome_pagador || '(sem nome)')}</span>
          <span class="valor-pendente">R$ ${Number(t.valor).toFixed(2)}</span>
        </div>
        <div class="meta-historico">${new Date(t.data_transacao).toLocaleDateString('pt-BR')} • ${escaparHtml(t.meio || '')}</div>
        <select class="select-vincular">
          <option value="">Vincular a quem?</option>
          ${todasPessoas.map(p => `<option value="${p.id}">${escaparHtml(p.nome)}</option>`).join('')}
        </select>
        <button class="botao-secundario btn-confirmar-vinculo">Vincular e lançar</button>
      </div>
    `).join('');

    listaEl.querySelectorAll('.item-pendente').forEach(item => {
      item.querySelector('.btn-confirmar-vinculo').addEventListener('click', async () => {
        const profileId = item.querySelector('.select-vincular').value;
        if (!profileId) { alert('Escolha uma pessoa primeiro.'); return; }
        await vincularTransacaoPendente(item.dataset.id, profileId, Number(item.dataset.valor));
      });
    });
  }

  async function vincularTransacaoPendente(transacaoId, profileId, valor) {
    const { data: contribuicaoInserida, error } = await supa
      .from('contribuicoes')
      .insert({
        profile_id: profileId,
        data: new Date().toISOString().split('T')[0],
        valor,
        meio_pagamento: 'pix',
        observacao: 'Vinculado manualmente a partir do PagBank',
      })
      .select('id')
      .single();

    if (error) { alert('Erro ao lançar: ' + error.message); return; }

    await supa.from('transacoes_bancarias')
      .update({ profile_id: profileId, contribuicao_id: contribuicaoInserida.id })
      .eq('id', transacaoId);

    await carregarPendentes();
    if (pessoaSelecionada && pessoaSelecionada.id === profileId) await carregarHistorico();
  }

  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  verificarSessao();
</script>
  <!-- ===== Modal de detalhes do evento ===== -->
  <div class="fundo-modal" id="fundo-modal">
    <div class="caixa-modal" id="caixa-modal"></div>
  </div>

</body>
</html>
